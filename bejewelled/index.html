<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gem Rush</title>
    <script src="../timeLimit.js"></script>
    <script src="../shared/settings.js"></script>
    <link rel="stylesheet" href="../shared/theme.css">
    <style>
        :root {
            --bg-color: var(--cyber-bg);
            --grid-bg: var(--cyber-surface);
            --accent: var(--cyber-magenta);
            --text: var(--cyber-text);
            --gem-size: 50px;
        }

        * {
            box-sizing: border-box;
            touch-action: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            background: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            width: 100vw;
        }

        /* --- Background --- */
        #bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #222233 0%, #050508 100%);
        }

        /* --- UI --- */
        #ui-layer {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: none;
            z-index: 10;
        }

        .score-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            pointer-events: auto;
        }

        .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #aaa;
            letter-spacing: 1px;
        }

        .value {
            font-size: 1.2rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* --- Game Board --- */
        #game-wrapper {
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            background: var(--grid-bg);
            border-radius: 12px;
            border: 4px solid #333;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            width: min(95vw, 90dvh);
            height: min(95vw, 90dvh);
            display: block;
        }

        /* Gems */
        .gem {
            position: absolute;
            width: 12.5%;
            height: 12.5%;
            top: 0;
            left: 0;
            padding: 2%;
            z-index: 2;
            cursor: pointer;
            /* No default transition to allow JS control */
        }

        .gem-inner {
            width: 100%;
            height: 100%;
            border-radius: 15%;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.4), 0 3px 5px rgba(0, 0, 0, 0.4);
            transition: filter 0.1s, transform 0.1s;
        }

        .gem.selected .gem-inner {
            filter: brightness(1.5);
            transform: scale(1.15);
            box-shadow: 0 0 15px white;
            z-index: 10;
        }

        .gem.match .gem-inner {
            animation: popOut 0.1s forwards;
        }

        @keyframes popOut {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.3);
                opacity: 0.8;
            }

            100% {
                transform: scale(0);
                opacity: 0;
            }
        }

        /* Shapes */
        .g0 .gem-inner {
            background: radial-gradient(circle at 30% 30%, #ff4d4d, #990000);
        }

        .g1 .gem-inner {
            background: radial-gradient(circle at 30% 30%, #4dff4d, #009900);
        }

        .g2 .gem-inner {
            background: radial-gradient(circle at 30% 30%, #4d4dff, #000099);
        }

        .g3 .gem-inner {
            background: radial-gradient(circle at 30% 30%, #ffff4d, #999900);
        }

        .g4 .gem-inner {
            background: radial-gradient(circle at 30% 30%, #ff4dff, #990099);
            border-radius: 50%;
        }

        .g5 .gem-inner {
            background: radial-gradient(circle at 30% 30%, #ff9e4d, #994c00);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            border-radius: 0;
        }

        .g6 .gem-inner {
            background: radial-gradient(circle at 30% 30%, #ffffff, #888888);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            border-radius: 0;
        }

        /* FX */
        #fx-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        .shake-anim {
            animation: shake 0.4s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-1px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(2px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-4px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(4px, 0, 0);
            }
        }

        /* Overlay */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .btn-play {
            background: linear-gradient(135deg, #ff00de, #00ffaa);
            border: none;
            padding: 20px 60px;
            font-size: 2rem;
            font-weight: 900;
            color: white;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 0, 222, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-play:active {
            transform: scale(0.95);
        }
    
        /* Powerup CSS */
        .gem.power-line-h .gem-inner { box-shadow: 0 0 15px #fff, inset 0 0 10px #fff; }
        .gem.power-line-h::after { content: '↔'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-weight: bold; font-size: 1.5rem; text-shadow: 0 0 5px black; z-index: 5; pointer-events:none;}
        
        .gem.power-line-v .gem-inner { box-shadow: 0 0 15px #fff, inset 0 0 10px #fff; }
        .gem.power-line-v::after { content: '↕'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-weight: bold; font-size: 1.5rem; text-shadow: 0 0 5px black; z-index: 5; pointer-events:none;}

        .gem.power-bomb .gem-inner { box-shadow: 0 0 20px #f00, inset 0 0 15px #f00; animation: pulse-bomb 0.8s infinite; }
        @keyframes pulse-bomb { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
        .gem.power-bomb::after { content: '💣'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.5rem; z-index: 5; pointer-events:none;}

        .gem.power-cross .gem-inner { box-shadow: 0 0 20px #ff0, inset 0 0 15px #ff0; }
        .gem.power-cross::after { content: '✛'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: yellow; font-size: 1.8rem; text-shadow: 0 0 5px black; z-index: 5; pointer-events:none;}

        .gem.power-color { animation: spin-colors 2s linear infinite; }
        .gem.power-color .gem-inner { background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red) !important; border-radius: 50% !important; box-shadow: inset 0 0 10px rgba(255,255,255,0.8), 0 0 20px #fff; clip-path:none;}
        @keyframes spin-colors { 100% { transform: rotate(360deg); } }
        
        .gem.power-mega-bomb .gem-inner { box-shadow: 0 0 30px #f0f, inset 0 0 25px #f0f; animation: pulse-mega 0.5s infinite; }
        @keyframes pulse-mega { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); filter: hue-rotate(90deg); } }
        .gem.power-mega-bomb::after { content: '☢'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 2rem; z-index: 5; pointer-events:none; text-shadow: 0 0 10px magenta;}
        
        /* Combo pop */
        #combo-popup { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); color: #fff; font-weight: 900; font-size: 4rem; text-shadow: 0 0 20px var(--cyber-magenta), 0 0 40px var(--cyber-magenta); z-index: 100; pointer-events: none; opacity: 0; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s; }
        #combo-popup.show { transform: translate(-50%, -50%) scale(1); opacity: 1; transition: transform 0.1s, opacity 0.1s; }

    </style>
</head>

<body>
    <div id="bg"></div>
    <div id="ui-layer">
        <button class="back-btn" onclick="window.location.href='../index.html'" style="pointer-events:auto;"> &lt; </button>
        <div class="score-box">
            <div class="label">Score</div>
            <div class="value" id="score">0</div>
        </div>
    </div>
    <div id="game-wrapper" class="shaker">
        <div id="game-container"></div>
    </div>
    <div id="overlay">
        <div
            style="font-size: 4rem; font-weight: 900; color: #fff; text-shadow: 0 0 20px #ff00de; margin-bottom: 30px;">
            GEM RUSH</div>
        <button class="btn-play" onclick="initGame()">PLAY</button>
    </div>
    <div id="combo-popup"></div>
    <canvas id="fx-canvas"></canvas>

    <script>
        const container = document.getElementById('game-container');
        const scoreEl = document.getElementById('score');
        const fxCanvas = document.getElementById('fx-canvas');
        const comboPopup = document.getElementById('combo-popup');
        const ctx = fxCanvas.getContext('2d');

        // --- Conf ---
        const ROWS = 8, COLS = 8, GEM_TYPES = 7;

        // --- State ---
        let grid = []; // Logical: { type, id, power }
        let gems = new Map(); // ID -> DOM Element
        let nextId = 1;
        let score = 0;
        let state = 'IDLE';
        let selected = null;
        let touchStart = null;
        let comboCount = 0;

        // --- Init ---
        function resize() { fxCanvas.width = window.innerWidth; fxCanvas.height = window.innerHeight; }
        window.onresize = resize; resize();
        function rnd(n) { return Math.floor(Math.random() * n); }

        function initGame() {
            document.getElementById('overlay').style.display = 'none';
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => { });
            container.innerHTML = '';
            grid = []; score = 0; comboCount = 0; updateScore(0);
            for (let y = 0; y < ROWS; y++) {
                let row = [];
                for (let x = 0; x < COLS; x++) {
                    let type;
                    do { type = rnd(GEM_TYPES); } while (
                        (x >= 2 && row[x - 1].type === type && row[x - 2].type === type) ||
                        (y >= 2 && grid[y - 1][x].type === type && grid[y - 2][x].type === type)
                    );
                    let id = nextId++;
                    let g = createGem(id, type, x, y, null);
                    gems.set(id, g);
                    container.appendChild(g);
                    row.push({ type, id, power: null });
                }
                grid.push(row);
            }
            state = 'IDLE';
        }

        function createGem(id, type, x, y, power) {
            let d = document.createElement('div');
            d.className = `gem g${type}`;
            if (power) {
                d.classList.add(`power-${power.replace('_','-').toLowerCase()}`);
            }
            d.innerHTML = `<div class="gem-inner"></div>`;
            d.style.transform = `translate(${x * 100}%, ${y * 100}%)`;
            d.dataset.id = id;
            d.onmousedown = (e) => handleInputStart(x, y, e.clientX, e.clientY);
            d.ontouchstart = (e) => { e.preventDefault(); handleInputStart(x, y, e.touches[0].clientX, e.touches[0].clientY); };
            return d;
        }

        function setGemPower(x, y, power) {
            let id = grid[y][x].id;
            grid[y][x].power = power;
            let g = gems.get(id);
            if(g) {
                g.className = `gem g${grid[y][x].type}`;
                if(power) g.classList.add(`power-${power.replace('_','-').toLowerCase()}`);
            }
        }

        // --- Input ---
        function handleInputStart(x, y, cx, cy) {
            if (state !== 'IDLE') return;
            touchStart = { x, y, cx, cy };
            document.onmousemove = handleInputMove;
            document.onmouseup = handleInputEnd;
            document.ontouchmove = (e) => handleInputMove(e.touches[0], {passive: false});
            document.ontouchend = handleInputEnd;
        }
        function handleInputMove(e) { }
        function handleInputEnd(e) {
            if (!touchStart) return;
            let cx, cy;
            if (e.type === 'mouseup') { cx = e.clientX; cy = e.clientY; }
            else if (e.changedTouches && e.changedTouches.length>0) { cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY; }
            else { cx = touchStart.cx; cy = touchStart.cy; }

            let dx = cx - touchStart.cx, dy = cy - touchStart.cy;
            let tx = touchStart.x, ty = touchStart.y;

            document.onmousemove = null; document.onmouseup = null;
            document.ontouchmove = null; document.ontouchend = null;

            // threshold tuned from 20 to 10
            if (Math.sqrt(dx * dx + dy * dy) < 10) handleClick(tx, ty);
            else {
                if (Math.abs(dx) > Math.abs(dy)) dx > 0 ? trySwap(tx, ty, tx + 1, ty) : trySwap(tx, ty, tx - 1, ty);
                else dy > 0 ? trySwap(tx, ty, tx, ty + 1) : trySwap(tx, ty, tx, ty - 1);
                if (selected) { gems.get(grid[selected.y][selected.x].id).classList.remove('selected'); selected = null; }
            }
            touchStart = null;
        }

        function handleClick(x, y) {
            if (selected) {
                let d = Math.abs(selected.x - x) + Math.abs(selected.y - y);
                if (d === 1) {
                    let prev = selected;
                    gems.get(grid[selected.y][selected.x].id).classList.remove('selected');
                    selected = null;
                    trySwap(prev.x, prev.y, x, y);
                } else {
                    gems.get(grid[selected.y][selected.x].id).classList.remove('selected');
                    if (selected.x === x && selected.y === y) selected = null;
                    else { selected = { x, y }; gems.get(grid[y][x].id).classList.add('selected'); playSound('select'); }
                }
            } else {
                selected = { x, y }; gems.get(grid[y][x].id).classList.add('selected'); playSound('select');
            }
        }

        async function trySwap(x1, y1, x2, y2) {
            if (x2 < 0 || x2 >= COLS || y2 < 0 || y2 >= ROWS) return;
            state = 'ANIMATING';
            comboCount = 0;

            let id1 = grid[y1][x1].id;
            let id2 = grid[y2][x2].id;
            
            let g1_type = grid[y1][x1].type;
            let g1_pow = grid[y1][x1].power;
            let g2_type = grid[y2][x2].type;
            let g2_pow = grid[y2][x2].power;

            // Swap animation faster: 80ms
            await animateSwap(id1, x1, y1, id2, x2, y2, 80);

            let temp = grid[y1][x1]; grid[y1][x1] = grid[y2][x2]; grid[y2][x2] = temp;
            updateDataset();
            
            // Check Color Bomb logic explicitly
            let colorBombTrigger = false;
            let destroySet = new Set();
            if (g1_pow === 'COLOR' || g2_pow === 'COLOR') {
                colorBombTrigger = true;
                if (g1_pow === 'COLOR' && g2_pow === 'COLOR') {
                    // Both color bombs - destroy whole board
                    for(let yy=0;yy<ROWS;yy++) for(let xx=0;xx<COLS;xx++) destroySet.add(`${xx},${yy}`);
                } else if (g1_pow === 'COLOR') {
                    let targetColor = g2_type;
                    destroySet.add(`${x2},${y2}`); // destroy the color bomb
                    for(let yy=0;yy<ROWS;yy++) for(let xx=0;xx<COLS;xx++) if(grid[yy][xx].type === targetColor) destroySet.add(`${xx},${yy}`);
                } else {
                    let targetColor = g1_type;
                    destroySet.add(`${x1},${y1}`);
                    for(let yy=0;yy<ROWS;yy++) for(let xx=0;xx<COLS;xx++) if(grid[yy][xx].type === targetColor) destroySet.add(`${xx},${yy}`);
                }
            }

            let matchGroups = findMatchGroups();
            if (matchGroups.length > 0 || colorBombTrigger) {
                playSound('swap');
                if(!colorBombTrigger) {
                    await resolveMatches(matchGroups, {x1, y1, x2, y2});
                } else {
                    await resolveDestruction(destroySet);
                }
            } else {
                playSound('bad');
                await animateSwap(id1, x2, y2, id2, x1, y1, 80); // Swap back
                temp = grid[y1][x1]; grid[y1][x1] = grid[y2][x2]; grid[y2][x2] = temp;
                updateDataset();
                state = 'IDLE';
            }
        }

        function animateSwap(id1, x1, y1, id2, x2, y2, time) {
            return new Promise(resolve => {
                let g1 = gems.get(id1);
                let g2 = gems.get(id2);
                if(!g1 || !g2) { resolve(); return; }
                g1.style.transition = `transform ${time}ms ease-out`;
                g2.style.transition = `transform ${time}ms ease-out`;
                g1.offsetHeight; // reflow
                g1.style.transform = `translate(${x2 * 100}%, ${y2 * 100}%)`;
                g2.style.transform = `translate(${x1 * 100}%, ${y1 * 100}%)`;
                setTimeout(resolve, time);
            });
        }

        function updateDataset() {
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    let g = gems.get(grid[y][x].id);
                    if (g) {
                        g.onmousedown = (e) => handleInputStart(x, y, e.clientX, e.clientY);
                        g.ontouchstart = (e) => { e.preventDefault(); handleInputStart(x, y, e.touches[0].clientX, e.touches[0].clientY); };
                    }
                }
            }
        }

        // --- Advanced Matching Algorithm ---
        function findMatchGroups() {
            let hLines = [];
            let vLines = [];
            
            // Horizontal lines
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS - 2; x++) {
                    let t = grid[y][x].type; if (t === -1) continue;
                    let l = 1; while (x + l < COLS && grid[y][x + l].type === t) l++;
                    if (l >= 3) {
                        let line = [];
                        for (let i = 0; i < l; i++) line.push({x: x + i, y});
                        hLines.push({ type: t, points: line, dir: 'H' });
                        x += l - 1;
                    }
                }
            }
            
            // Vertical lines
            for (let x = 0; x < COLS; x++) {
                for (let y = 0; y < ROWS - 2; y++) {
                    let t = grid[y][x].type; if (t === -1) continue;
                    let l = 1; while (y + l < ROWS && grid[y + l][x].type === t) l++;
                    if (l >= 3) {
                        let line = [];
                        for (let i = 0; i < l; i++) line.push({x, y: y + i});
                        vLines.push({ type: t, points: line, dir: 'V' });
                        y += l - 1;
                    }
                }
            }
            
            // Group intersecting lines of the same type
            let allLines = hLines.concat(vLines);
            let visited = new Set();
            let groups = [];
            
            for(let i = 0; i < allLines.length; i++) {
                if(visited.has(i)) continue;
                let clusterLines = [allLines[i]];
                let clusterPoints = new Set();
                allLines[i].points.forEach(p => clusterPoints.add(`${p.x},${p.y}`));
                visited.add(i);
                
                let changed = true;
                while(changed) {
                    changed = false;
                    for(let j = 0; j < allLines.length; j++) {
                        if(visited.has(j)) continue;
                        if(allLines[j].type !== allLines[i].type) continue;
                        
                        let intersects = false;
                        for(let p of allLines[j].points) {
                            if(clusterPoints.has(`${p.x},${p.y}`)) { intersects = true; break; }
                        }
                        if(intersects) {
                            allLines[j].points.forEach(p => clusterPoints.add(`${p.x},${p.y}`));
                            clusterLines.push(allLines[j]);
                            visited.add(j);
                            changed = true;
                        }
                    }
                }
                groups.push({
                    type: allLines[i].type,
                    lines: clusterLines,
                    points: Array.from(clusterPoints).map(s => { let [x,y] = s.split(',').map(Number); return {x,y}; })
                });
            }
            
            return groups;
        }

        async function resolveMatches(matchGroups, swapData) {
            comboCount++;
            let destroySet = new Set();
            let newPowers = [];
            
            matchGroups.forEach(g => {
                let size = g.points.length;
                let powerGenerated = null;
                let targetPos = null;
                
                // Determine Power
                if (size > 5) {
                    powerGenerated = 'MEGA_BOMB';
                } else if (size === 5) {
                    // Check if it's a straight line
                    let isStraight = g.lines.length === 1;
                    if (isStraight) powerGenerated = 'COLOR';
                    else powerGenerated = 'BOMB'; // T, L, or +
                } else if (size === 4) {
                    if (g.lines[0].dir === 'H') powerGenerated = 'LINE_H';
                    else powerGenerated = 'LINE_V';
                }
                
                // Determine Placement
                if (powerGenerated) {
                    if (swapData) {
                        if(g.points.find(p => p.x === swapData.x1 && p.y === swapData.y1)) targetPos = {x: swapData.x1, y: swapData.y1};
                        else if(g.points.find(p => p.x === swapData.x2 && p.y === swapData.y2)) targetPos = {x: swapData.x2, y: swapData.y2};
                    }
                    if(!targetPos) {
                        // Intersection point
                        if(g.lines.length > 1) {
                            let pts0 = g.lines[0].points.map(p=>`${p.x},${p.y}`);
                            for(let pt of g.lines[1].points) {
                                if(pts0.includes(`${pt.x},${pt.y}`)) { targetPos = pt; break; }
                            }
                        }
                    }
                    if(!targetPos) targetPos = g.points[Math.floor(g.points.length/2)];
                    
                    newPowers.push({ x: targetPos.x, y: targetPos.y, type: g.type, power: powerGenerated });
                }
                
                g.points.forEach(p => {
                    if(!targetPos || p.x !== targetPos.x || p.y !== targetPos.y) destroySet.add(`${p.x},${p.y}`);
                });
            });

            // Set new powers before destruction visual
            newPowers.forEach(np => {
                setGemPower(np.x, np.y, np.power);
            });
            
            await resolveDestruction(destroySet);
        }

        async function resolveDestruction(destroySet) {
            let toDestroy = new Set(destroySet);
            let processed = new Set();
            let newScore = 0;
            
            // Resolve powerups in destruction queue
            let chainReaction = true;
            while(chainReaction) {
                chainReaction = false;
                let currentBatch = Array.from(toDestroy);
                for(let ptStr of currentBatch) {
                    if(processed.has(ptStr)) continue;
                    processed.add(ptStr);
                    let [x,y] = ptStr.split(',').map(Number);
                    if(grid[y] && grid[y][x]) {
                        let pow = grid[y][x].power;
                        if(pow === 'LINE_H') {
                            for(let xx=0;xx<COLS;xx++) if(!toDestroy.has(`${xx},${y}`)) { toDestroy.add(`${xx},${y}`); chainReaction=true; }
                            playSound('bomb');
                            spawnParticles(x*100+50, y*100+50, grid[y][x].type, 20);
                        } else if(pow === 'LINE_V') {
                            for(let yy=0;yy<ROWS;yy++) if(!toDestroy.has(`${x},${yy}`)) { toDestroy.add(`${x},${yy}`); chainReaction=true; }
                            playSound('bomb');
                            spawnParticles(x*100+50, y*100+50, grid[y][x].type, 20);
                        } else if(pow === 'BOMB' || pow === 'CROSS' || pow === 'MEGA_BOMB') {
                            // Bomb is 3x3, Cross is row+col, Mega Bomb is 5x5
                            if(pow==='BOMB') {
                                for(let dy=-1;dy<=1;dy++) {
                                    for(let dx=-1;dx<=1;dx++) {
                                        let nx = x+dx, ny = y+dy;
                                        if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS && !toDestroy.has(`${nx},${ny}`)) { toDestroy.add(`${nx},${ny}`); chainReaction=true; }
                                    }
                                }
                            } else if(pow==='MEGA_BOMB') {
                                for(let dy=-2;dy<=2;dy++) {
                                    for(let dx=-2;dx<=2;dx++) {
                                        let nx = x+dx, ny = y+dy;
                                        if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS && !toDestroy.has(`${nx},${ny}`)) { toDestroy.add(`${nx},${ny}`); chainReaction=true; }
                                    }
                                }
                            } else {
                                for(let xx=0;xx<COLS;xx++) if(!toDestroy.has(`${xx},${y}`)) { toDestroy.add(`${xx},${y}`); chainReaction=true; }
                                for(let yy=0;yy<ROWS;yy++) if(!toDestroy.has(`${x},${yy}`)) { toDestroy.add(`${x},${yy}`); chainReaction=true; }
                            }
                            playSound('big_bomb');
                            spawnParticles(x*100+50, y*100+50, grid[y][x].type, pow==='MEGA_BOMB'?50:30);
                            shakeWrapper(pow==='MEGA_BOMB'?3:2);
                        } else if(pow === 'COLOR') {
                            // Already triggered by swap, but if blown up incidentally, destroy random color
                            let c = rnd(GEM_TYPES);
                            for(let yy=0;yy<ROWS;yy++) for(let xx=0;xx<COLS;xx++) if(grid[yy][xx].type === c && !toDestroy.has(`${xx},${yy}`)) { toDestroy.add(`${xx},${yy}`); chainReaction=true; }
                            playSound('big_bomb');
                        }
                    }
                }
            }

            let pts = Array.from(toDestroy).map(s=> { let [x,y]=s.split(',').map(Number); return {x,y}; });
            if(pts.length === 0) {
                state = 'IDLE';
                return;
            }

            // Visual destruction
            pts.forEach(m => {
                let id = grid[m.y][m.x].id;
                let g = gems.get(id);
                if(g) {
                    g.classList.add('match');
                    let rect = g.getBoundingClientRect();
                    spawnParticles(rect.x + rect.width / 2, rect.y + rect.height / 2, grid[m.y][m.x].type, 10);
                }
            });
            
            // Score calc
            score += pts.length * 50 * comboCount;
            if (pts.length > 4 || comboCount > 1) playSound('combo', comboCount);
            else playSound('match');
            updateScore(score);
            shakeWrapper(pts.length > 5 ? 2 : 1);
            
            if(comboCount > 1) showComboText(comboCount);

            // Wait for pop animation: reduced to 80ms
            await sleep(80);

            pts.forEach(m => {
                let id = grid[m.y][m.x].id;
                let g = gems.get(id);
                if(g) { g.remove(); gems.delete(id); }
                grid[m.y][m.x] = { type: -1, id: -1, power: null };
            });
            await applyGravity();
        }

        async function applyGravity() {
            let moves = [];
            // Calculate drops
            for (let x = 0; x < COLS; x++) {
                let writeY = ROWS - 1;
                for (let y = ROWS - 1; y >= 0; y--) {
                    if (grid[y][x].type !== -1) {
                        if (writeY !== y) {
                            let g = gems.get(grid[y][x].id);
                            grid[writeY][x] = grid[y][x];
                            grid[y][x] = { type: -1, id: -1, power: null };

                            // Physics Drop - FASTER
                            let dist = (writeY - y);
                            let time = 60 + (dist * 12); 

                            g.style.transition = `transform ${time}ms cubic-bezier(0.34, 1.56, 0.64, 1)`;
                            g.style.transform = `translate(${x * 100}%, ${writeY * 100}%)`;

                            moves.push(
                                new Promise(r => setTimeout(() => {
                                    playSound('clink');
                                    r();
                                }, time))
                            );
                        }
                        writeY--;
                    }
                }
                // Spawn
                for (let y = writeY; y >= 0; y--) {
                    let type = rnd(GEM_TYPES);
                    let power = null;
                    // Guaranteed powerup on big combo
                    if (comboCount >= 4) {
                        power = ['LINE_H','LINE_V','BOMB', 'CROSS', 'COLOR'][Math.floor(Math.random()*5)];
                    } else if (comboCount >= 3 && Math.random() < 0.5) {
                        power = ['LINE_H','LINE_V'][Math.floor(Math.random()*2)];
                    }
                    let id = nextId++;
                    let g = createGem(id, type, x, y, power);
                    container.appendChild(g); gems.set(id, g);
                    grid[y][x] = { type, id, power };

                    g.style.transition = 'none';
                    g.style.transform = `translate(${x * 100}%, -${(writeY - y + 1) * 100}%)`;

                    g.offsetHeight; // Reflow

                    let time = 80 + (y * 10);
                    g.style.transition = `transform ${time}ms cubic-bezier(0.34, 1.56, 0.64, 1)`;
                    g.style.transform = `translate(${x * 100}%, ${y * 100}%)`;

                    moves.push(new Promise(r => setTimeout(() => {
                        playSound('clink');
                        r();
                    }, time)));
                }
            }
            updateDataset();
            if (moves.length > 0) await Promise.all(moves);

            let newM = findMatchGroups();
            if (newM.length > 0) {
                await sleep(20); // super fast cascade
                await resolveMatches(newM, null);
            } else {
                state = 'IDLE';
                comboCount = 0;
            }
        }

        function updateScore(s) { scoreEl.innerText = s; }
        
        function shakeWrapper(intensity=1) {
            let w = document.getElementById('game-wrapper');
            w.classList.remove('shake-anim'); w.offsetHeight; 
            if(intensity===3) {
                w.style.animationDuration = '0.9s';
            } else if(intensity===2) {
                w.style.animationDuration = '0.6s';
            } else {
                w.style.animationDuration = '0.3s';
            }
            w.classList.add('shake-anim');
        }

        function showComboText(combo) {
            comboPopup.innerText = combo + "X COMBO!";
            comboPopup.classList.add('show');
            setTimeout(() => comboPopup.classList.remove('show'), 800);
        }

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        // --- Audio ---
        const A = window.AudioContext || window.webkitAudioContext;
        const ac = new A();
        function playSound(t, param) {
            if (window.GameSettings && !window.GameSettings.get().sound) return;
            if (ac.state === 'suspended') ac.resume();
            let o = ac.createOscillator(), g = ac.createGain();
            o.connect(g); g.connect(ac.destination);
            let n = ac.currentTime;

            if (t === 'select') {
                o.frequency.setValueAtTime(400, n); g.gain.setValueAtTime(0.05, n);
                g.gain.linearRampToValueAtTime(0, n + 0.05); o.start(n); o.stop(n + 0.05);
            } else if (t === 'swap') {
                o.frequency.setValueAtTime(300, n); o.frequency.linearRampToValueAtTime(500, n + 0.1);
                g.gain.setValueAtTime(0.05, n); g.gain.linearRampToValueAtTime(0, n + 0.15);
                o.start(n); o.stop(n + 0.15);
            } else if (t === 'match') {
                o.frequency.setValueAtTime(440, n); o.frequency.linearRampToValueAtTime(880, n + 0.1);
                g.gain.setValueAtTime(0.1, n); g.gain.exponentialRampToValueAtTime(0.001, n + 0.3);
                o.start(n); o.stop(n + 0.3);
            } else if (t === 'bad') {
                o.type = 'sawtooth'; o.frequency.setValueAtTime(150, n); o.frequency.linearRampToValueAtTime(100, n + 0.2);
                g.gain.setValueAtTime(0.1, n); g.gain.linearRampToValueAtTime(0, n + 0.2);
                o.start(n); o.stop(n + 0.2);
            } else if (t === 'bomb' || t === 'big_bomb') {
                o.type = 'square';
                o.frequency.setValueAtTime(100, n);
                o.frequency.exponentialRampToValueAtTime(10, n + 0.5);
                g.gain.setValueAtTime(t==='big_bomb'?0.3:0.15, n);
                g.gain.exponentialRampToValueAtTime(0.001, n + 0.5);
                o.start(n); o.stop(n + 0.5);
            } else if (t === 'combo') {
                let base = 440 + (param * 100);
                o.type = 'triangle';
                o.frequency.setValueAtTime(base, n);
                o.frequency.linearRampToValueAtTime(base*1.5, n + 0.3);
                g.gain.setValueAtTime(0.15, n);
                g.gain.exponentialRampToValueAtTime(0.001, n + 0.4);
                o.start(n); o.stop(n + 0.4);
            } else if (t === 'clink') {
                o.type = 'triangle';
                o.frequency.setValueAtTime(1200 + Math.random() * 400, n);
                g.gain.setValueAtTime(0.015, n); g.gain.exponentialRampToValueAtTime(0.001, n + 0.08);
                o.start(n); o.stop(n + 0.08);
            }
        }

        // --- FX ---
        let parts = [];
        function spawnParticles(x, y, t, count=8) {
            let c = ['#f00', '#0f0', '#00f', '#ff0', '#f0f', '#fa0', '#fff'][t];
            if(!c) c = '#fff';
            for (let i = 0; i < count; i++) { 
                let speed = 5 + Math.random()*15;
                let angle = Math.random() * Math.PI * 2;
                parts.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, l: 1, c, decay: 0.02 + Math.random()*0.05 }); 
            }
        }
        function drawFX() {
            ctx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
            for (let i = parts.length - 1; i >= 0; i--) {
                let p = parts[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.8; p.l -= p.decay;
                if (p.l <= 0) { parts.splice(i, 1); continue; }
                ctx.globalAlpha = p.l; ctx.fillStyle = p.c;
                ctx.beginPath(); ctx.arc(p.x, p.y, 6 * p.l, 0, 7); ctx.fill();
            }
            requestAnimationFrame(drawFX);
        }
        drawFX();

    </script>
