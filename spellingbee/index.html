<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="game-id" content="spellingbee">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NEURO_HUB: SPELLING_BEE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="../timeLimit.js"></script>
    <script src="../shared/settings.js"></script>
    <script src="../shared/dictionary.js"></script>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body {
            margin: 0;
            overflow-x: hidden;
            overflow-y: auto;
            touch-action: manipulation;
            background-color: var(--cyber-bg);
            color: var(--cyber-text);
        }

        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%,
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.06),
                rgba(0, 255, 0, 0.02),
                rgba(0, 0, 255, 0.06)
            );
            background-size: 100% 4px, 6px 100%;
            z-index: 100;
            pointer-events: none;
        }

        /* Pulse voice speaker glow */
        @keyframes speakerPulse {
            0% {
                box-shadow: 0 0 10px rgba(0, 243, 255, 0.4), inset 0 0 5px rgba(0, 243, 255, 0.2);
            }
            50% {
                box-shadow: 0 0 25px rgba(0, 243, 255, 0.8), inset 0 0 15px rgba(0, 243, 255, 0.5);
                transform: scale(1.05);
            }
            100% {
                box-shadow: 0 0 10px rgba(0, 243, 255, 0.4), inset 0 0 5px rgba(0, 243, 255, 0.2);
            }
        }

        .speaking-glow {
            animation: speakerPulse 1s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
            border-color: var(--cyber-cyan) !important;
            color: var(--cyber-cyan) !important;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Glass panel cyberpunk styled card */
        .glass-panel {
            background: rgba(10, 10, 31, 0.75);
            border: 1px solid rgba(0, 243, 255, 0.15);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.05);
            backdrop-filter: blur(8px);
        }

        .glass-panel-magenta {
            background: rgba(10, 10, 31, 0.75);
            border: 1px solid rgba(255, 0, 255, 0.2);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.05);
            backdrop-filter: blur(8px);
        }

        /* Keyboard styling */
        .keyboard-key {
            background: rgba(20, 20, 45, 0.8);
            border: 1px solid rgba(0, 243, 255, 0.25);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.2);
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        .keyboard-key:active {
            transform: scale(0.92);
            background: var(--cyber-cyan);
            color: #000;
            box-shadow: var(--cyber-glow-cyan);
            border-color: var(--cyber-cyan);
        }

        .keyboard-key-action {
            background: rgba(45, 20, 55, 0.8);
            border: 1px solid rgba(255, 0, 255, 0.35);
        }

        .keyboard-key-action:active {
            background: var(--cyber-magenta);
            color: #000;
            box-shadow: var(--cyber-glow-magenta);
            border-color: var(--cyber-magenta);
        }

        .cyber-grid-title {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>
    <div class="scanlines"></div>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const KEYBOARD_LAYOUT = [
            'QWERTYUIOP'.split(''),
            'ASDFGHJKL'.split(''),
            ['CLEAR', ...'ZXCVBNM'.split(''), 'BACK']
        ];

        // Grade definitions mapping difficulty score ranges
        const GRADES = [
            { id: 1, name: "Grade 1", desc: "Basic 3-4 letter phonics", min: 0, max: 6.0 },
            { id: 2, name: "Grade 2", desc: "4-5 letter blends", min: 6.0, max: 8.5 },
            { id: 3, name: "Grade 3", desc: "Silent patterns & vowel blends", min: 8.5, max: 11.0 },
            { id: 4, name: "Grade 4", desc: "Intermediate rules & roots", min: 11.0, max: 13.5 },
            { id: 5, name: "Grade 5", desc: "Prefix/suffix & complex blends", min: 13.5, max: 16.0 },
            { id: 6, name: "Grade 6", desc: "Advanced vocabulary", min: 16.0, max: 18.5 },
            { id: 7, name: "Grade 7", desc: "Irregular spelling structures", min: 18.5, max: 21.0 },
            { id: 8, name: "Grade 8", desc: "Highly complex & compound words", min: 21.0, max: 24.0 },
            { id: 9, name: "Champion", desc: "Loanwords, anomalies & elite bee terms", min: 24.0, max: 100.0 }
        ];

        // Custom buzzer / incorrect sound
        const playIncorrectChime = () => {
            try {
                if (window.GameSettings && !window.GameSettings.get().sound) return;
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return;
                const audioCtx = new AudioContextClass();
                const now = audioCtx.currentTime;
                
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(140, now);
                osc.frequency.linearRampToValueAtTime(80, now + 0.35);
                
                gainNode.gain.setValueAtTime(0.12, now);
                gainNode.gain.exponentialRampToValueAtTime(0.005, now + 0.35);
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.start(now);
                osc.stop(now + 0.35);
            } catch (e) {
                console.warn("Audio failure chime failed:", e);
            }
        };

        // Spelling Bee Difficulty Scoring Algorithm
        const calculateWordDifficulty = (word) => {
            if (!word) return { score: 0, triggers: [] };
            
            // 1. Length Score
            let score = word.length * 1.15;
            const triggers = [];

            // 2. Rare Letters (Q, X, Z, J, V, K, W, Y)
            const rareLetters = ['Q', 'X', 'Z', 'J', 'V', 'K', 'W', 'Y'];
            let rareCount = 0;
            for (let c of word) {
                if (rareLetters.includes(c)) {
                    rareCount++;
                }
            }
            if (rareCount > 0) {
                score += rareCount * 1.8;
                triggers.push(`Rare letters (+${(rareCount * 1.8).toFixed(1)})`);
            }

            // 3. Double Consonants or Vowels (e.g. LL, SS, EE, TT, etc.)
            const doubleMatches = word.match(/(.)\1/g);
            if (doubleMatches) {
                score += doubleMatches.length * 1.4;
                triggers.push(`Double consonant/vowel (+${(doubleMatches.length * 1.4).toFixed(1)})`);
            }

            // 4. Silent combinations and complex rules (Distance from contemporary rules)
            const complexRules = [
                { regex: /KN/g, val: 2.0, name: "Silent 'kn'" },
                { regex: /GN/g, val: 2.0, name: "Silent 'gn'" },
                { regex: /PN/g, val: 2.5, name: "Silent 'pn'" },
                { regex: /PS/g, val: 2.5, name: "Silent 'ps'" },
                { regex: /WR/g, val: 2.0, name: "Silent 'wr'" },
                { regex: /MB/g, val: 2.0, name: "Silent 'mb'" },
                { regex: /MN/g, val: 2.2, name: "Silent 'mn'" },
                { regex: /GH/g, val: 2.0, name: "Irregular 'gh'" },
                { regex: /PH/g, val: 1.5, name: "Phonetic 'ph'" },
                { regex: /SC/g, val: 2.0, name: "Soft 'sc'" },
                { regex: /EI/g, val: 2.2, name: "Tricky 'ei'" },
                { regex: /IE/g, val: 1.8, name: "Tricky 'ie'" },
                { regex: /UI/g, val: 2.0, name: "Silent 'ui'" },
                { regex: /EAU/g, val: 3.0, name: "French root 'eau'" },
                { regex: /OUGH/g, val: 3.2, name: "Irregular 'ough'" },
                { regex: /AUGH/g, val: 3.2, name: "Irregular 'augh'" },
                { regex: /C[IEY]/g, val: 1.5, name: "Soft 'c'" },
                { regex: /G[IEY]/g, val: 1.5, name: "Soft 'g'" },
                { regex: /CI[AEIOU]/g, val: 2.0, name: "Soft 'ci' blend" },
                { regex: /TI[AEIOU]/g, val: 2.0, name: "Soft 'ti' blend" },
                { regex: /SI[AEIOU]/g, val: 2.0, name: "Soft 'si' blend" },
                { regex: /WH/g, val: 1.0, name: "Digraph 'wh'" },
                { regex: /TCH/g, val: 1.2, name: "Blend 'tch'" }
            ];

            complexRules.forEach(rule => {
                const matches = word.match(rule.regex);
                if (matches) {
                    score += rule.val * matches.length;
                    triggers.push(`${rule.name} (+${(rule.val * matches.length).toFixed(1)})`);
                }
            });

            return { score, triggers };
        };

        const App = () => {
            const [wordPool, setWordPool] = useState({}); // { gradeLevel: [words] }
            const [currentGrade, setCurrentGrade] = useState(3); // Default to Grade 3
            const [currentWord, setCurrentWord] = useState('');
            const [currentDefinition, setCurrentDefinition] = useState('');
            const [wordDetail, setWordDetail] = useState({ score: 0, triggers: [] });
            const [typedWord, setTypedWord] = useState('');
            const [gameStatus, setGameStatus] = useState('loading'); // loading, ready, playing, result
            const [isSpeaking, setIsSpeaking] = useState(false);
            const [isCorrect, setIsCorrect] = useState(false);
            const [ttsRate, setTtsRate] = useState(0.85); // 0.85 = standard spelling bee, 0.6 = slow

            // Stats
            const [stats, setStats] = useState({ played: 0, correct: 0 });

            // Toast feedback message
            const [toastMessage, setToastMessage] = useState(null);

            // Ref for responsive audio initialization
            const hasInitializedSpeech = useRef(false);

            // Load Dictionary & Prepare Word Pools by Grade Levels
            useEffect(() => {
                // Ensure DefinitionManager starts loading
                if (window.DefinitionManager) {
                    window.DefinitionManager.load().then(() => {
                        initializeWordPool();
                    }).catch(err => {
                        console.error("Failed to load DefinitionManager meta:", err);
                        initializeWordPool();
                    });
                } else {
                    initializeWordPool();
                }

                // Load Stats
                try {
                    const saved = localStorage.getItem('spellingbee_stats');
                    if (saved) setStats(JSON.parse(saved));
                } catch (e) {}

                // Warm up SpeechSynthesis voices
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.getVoices();
                }
            }, []);

            const initializeWordPool = () => {
                const uniqueWords = new Set();
                const addFromSource = (source) => {
                    if (!source) return;
                    let list = [];
                    if (typeof source === 'string') {
                        list = source.split(' ');
                    } else if (Array.isArray(source)) {
                        list = source;
                    } else if (typeof source === 'object') {
                        list = Object.keys(source);
                    }
                    list.forEach(w => {
                        const clean = w.trim().toUpperCase();
                        if (/^[A-Z]{3,}$/.test(clean)) {
                            uniqueWords.add(clean);
                        }
                    });
                };

                addFromSource(window.COMMON_WORDS_SEED);
                addFromSource(window.WORDLE_WORDS);
                addFromSource(window.LEXICON_WORDS);

                const finalWords = Array.from(uniqueWords);

                // Classify into grades based on difficulty score
                const pools = {};
                GRADES.forEach(g => { pools[g.id] = []; });

                finalWords.forEach(word => {
                    const details = calculateWordDifficulty(word);
                    // Match to correct grade bucket
                    const matchedGrade = GRADES.find(g => details.score >= g.min && details.score < g.max);
                    if (matchedGrade) {
                        pools[matchedGrade.id].push(word);
                    } else if (details.score >= 24.0) {
                        pools[9].push(word); // Champion fallback
                    }
                });

                // Fallback check to ensure no grade level pool is empty
                GRADES.forEach(g => {
                    if (!pools[g.id] || pools[g.id].length === 0) {
                        // Put some emergency words
                        if (g.id === 1) pools[g.id] = ["CAT", "DOG", "SUN", "BED", "BOX", "RUN", "RED", "TEN", "WIN"];
                        else if (g.id === 2) pools[g.id] = ["GREEN", "HAPPY", "WATER", "PLAY", "BOOK", "HOME", "BEST"];
                        else if (g.id === 3) pools[g.id] = ["KNIFE", "BRIGHT", "AUTUMN", "FLOWER", "SOLEMN", "PHONES"];
                        else pools[g.id] = ["KNOWLEDGE", "BEAUTIFUL", "DANGEROUS", "CELEBRATION", "CHAMPIONSHIP"];
                    }
                });

                setWordPool(pools);
                setGameStatus('ready');
            };

            // Trigger a SpeechSynthesis voice output
            const speakText = (text, rate = 0.85) => {
                if (!('speechSynthesis' in window)) {
                    showToast("Audio unavailable in this browser.");
                    return;
                }
                
                window.speechSynthesis.cancel(); // Stop ongoing speech

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = rate;

                // Grab a premium English voice if possible
                const voices = window.speechSynthesis.getVoices();
                const englishVoice = voices.find(v => v.lang.startsWith('en-US') || v.lang.startsWith('en-GB') || v.lang.startsWith('en'));
                if (englishVoice) {
                    utterance.voice = englishVoice;
                }

                utterance.onstart = () => setIsSpeaking(true);
                utterance.onend = () => setIsSpeaking(false);
                utterance.onerror = () => setIsSpeaking(false);

                window.speechSynthesis.speak(utterance);
            };

            const speakCurrentWord = (rate = null) => {
                if (!currentWord) return;
                const finalRate = rate !== null ? rate : ttsRate;
                speakText(currentWord.toLowerCase(), finalRate);
            };

            const readDefinitionAloud = () => {
                if (!currentDefinition || !currentWord) return;
                
                // Construct spelling bee format
                const cleanDef = currentDefinition.replace(/\[Plural of [^\]]+\]\s*/g, '');
                const text = `The word is: ${currentWord.toLowerCase()}. Definition: ${cleanDef}.`;
                speakText(text, 0.85);
            };

            // Select a new word and fetch its definition
            const selectNextWord = async (selectedGrade = currentGrade) => {
                const pool = wordPool[selectedGrade];
                if (!pool || pool.length === 0) return;

                setGameStatus('loading');
                setTypedWord('');

                let chosenWord = '';
                let definition = '';
                let detailObj = { score: 0, triggers: [] };
                let attempts = 0;

                // Try to find a word with a valid dictionary definition
                while (attempts < 10) {
                    const randWord = pool[Math.floor(Math.random() * pool.length)];
                    detailObj = calculateWordDifficulty(randWord);

                    if (window.DefinitionManager) {
                        const fetched = await window.DefinitionManager.getDetails(randWord);
                        if (fetched && fetched.def) {
                            chosenWord = randWord;
                            definition = fetched.def;
                            
                            // Adjust difficulty if word has an interesting origin in definition
                            const originMatch = fetched.def.match(/\((Yiddish|French|Greek|Latin|Italian|Arabic|Spanish|German|Russian|Japanese|Hebrew|Sanskrit|Creole|Hindi)\)/i);
                            if (originMatch) {
                                detailObj.score += 3.0;
                                detailObj.triggers.push(`Loanword origin: ${originMatch[1]} (+3.0)`);
                            }
                            break;
                        }
                    } else {
                        chosenWord = randWord;
                        definition = "A dictionary definition is unavailable, but spelling rules apply.";
                        break;
                    }
                    attempts++;
                }

                // Hard fallback if loop failed to find a defined word
                if (!chosenWord) {
                    chosenWord = pool[Math.floor(Math.random() * pool.length)];
                    detailObj = calculateWordDifficulty(chosenWord);
                    definition = "A dictionary definition is unavailable, but spelling rules apply.";
                }

                setCurrentWord(chosenWord);
                setCurrentDefinition(definition);
                setWordDetail(detailObj);
                setGameStatus('playing');

                // Play spelling bee sound prompt
                setTimeout(() => {
                    speakText(chosenWord.toLowerCase(), ttsRate);
                }, 400);
            };

            // Handle virtual and physical keypresses
            const handleKey = (key) => {
                if (gameStatus !== 'playing') return;

                if (key === 'BACK') {
                    setTypedWord(prev => prev.slice(0, -1));
                } else if (key === 'CLEAR') {
                    setTypedWord('');
                } else if (/^[A-Z]$/.test(key)) {
                    // Maximum spelling length limit safety
                    if (typedWord.length < currentWord.length + 3) {
                        setTypedWord(prev => prev + key);
                    }
                }
            };

            const submitSpelling = () => {
                if (gameStatus !== 'playing') return;
                if (!typedWord.trim()) {
                    showToast("Spell something first!");
                    return;
                }

                const correct = typedWord.trim().toUpperCase() === currentWord.toUpperCase();
                setIsCorrect(correct);
                setGameStatus('result');

                // Update session stats
                const newStats = {
                    played: stats.played + 1,
                    correct: correct ? stats.correct + 1 : stats.correct
                };
                setStats(newStats);
                try {
                    localStorage.setItem('spellingbee_stats', JSON.stringify(newStats));
                } catch (e) {}

                if (correct) {
                    // Reward XP dynamically based on Grade Level difficulty
                    // Grade 1 = 50XP, Grade 2 = 100XP, etc.
                    const basePoints = currentGrade * 50;
                    if (window.GlobalScore) {
                        window.GlobalScore.add(basePoints);
                    }
                    showToast("CORRECT SPELLING!");
                } else {
                    playIncorrectChime();
                    showToast("INCORRECT SPELLING");
                }
            };

            // Keyboard listeners for physical desktop keyboards
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.ctrlKey || e.metaKey || e.altKey) return;
                    const key = e.key.toUpperCase();
                    if (key === 'ENTER') {
                        if (gameStatus === 'playing') {
                            submitSpelling();
                        } else if (gameStatus === 'result') {
                            selectNextWord(currentGrade);
                        }
                    } else if (key === 'BACKSPACE') {
                        e.preventDefault();
                        handleKey('BACK');
                    } else if (key === 'ESCAPE') {
                        handleKey('CLEAR');
                    } else if (/^[A-Z]$/.test(key)) {
                        handleKey(key);
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [typedWord, currentWord, gameStatus, currentGrade]);

            const changeGrade = (gradeId) => {
                setCurrentGrade(gradeId);
                selectNextWord(gradeId);
            };

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 2500);
            };

            return (
                <div className="flex flex-col h-[100dvh] w-full max-w-lg mx-auto relative bg-transparent overflow-hidden">
                    
                    {/* Header HUD */}
                    <div className="cyber-header w-full">
                        <a href="../index.html" className="back-btn">
                            &lt; HUB
                        </a>
                        <h1 className="text-xl md:text-2xl font-extrabold tracking-wider text-cyan-400">SPELLING_BEE</h1>
                        
                        <div className="flex gap-2">
                            {/* Stats Pill */}
                            <div className="hud-pill flex items-center gap-1.5 px-3 py-1 font-bold text-xs" style={{ boxShadow: 'none' }}>
                                <span className="text-[10px] text-gray-500">ACCURACY:</span>
                                <span className="text-cyan-400">
                                    {stats.played > 0 ? Math.round((stats.correct / stats.played) * 100) : 0}%
                                </span>
                            </div>
                        </div>
                    </div>

                    {/* Toast Notification */}
                    {toastMessage && (
                        <div className="absolute top-16 left-1/2 transform -translate-x-1/2 bg-black/90 border border-cyan-400 text-cyan-400 px-6 py-2.5 rounded font-black shadow-lg z-50 text-sm tracking-widest font-mono text-center">
                            {toastMessage}
                        </div>
                    )}

                    {/* Main Game Interface */}
                    <div className="flex-1 flex flex-col p-4 space-y-4 overflow-y-auto min-h-0 select-none pb-8">
                        
                        {/* Selector Segmented Control */}
                        <div className="flex-none glass-panel rounded-lg p-2.5">
                            <label className="block text-[10px] text-cyan-400 font-bold font-mono tracking-widest mb-1.5 uppercase">
                                GRADE_LEVEL_SELECTOR
                            </label>
                            <div className="grid grid-cols-5 gap-1.5">
                                {GRADES.map(g => (
                                    <button
                                        key={g.id}
                                        onClick={() => changeGrade(g.id)}
                                        className={`py-1 text-xs font-black rounded border font-mono transition-all ${
                                            currentGrade === g.id
                                                ? 'bg-cyan-400 border-cyan-400 text-black shadow-[0_0_10px_rgba(0,243,255,0.4)]'
                                                : 'bg-black/40 border-cyan-400/25 text-cyan-400 hover:border-cyan-400/60'
                                        }`}
                                    >
                                        G{g.id === 9 ? '★' : g.id}
                                    </button>
                                ))}
                            </div>
                            <div className="text-[10px] text-gray-500 font-mono mt-1 text-center italic">
                                {GRADES.find(g => g.id === currentGrade).desc}
                            </div>
                        </div>

                        {/* Interactive Play Arena */}
                        {gameStatus === 'loading' && (
                            <div className="flex-1 flex flex-col justify-center items-center py-12">
                                <div className="w-10 h-10 border-2 border-cyan-400 border-t-transparent rounded-full animate-spin"></div>
                                <div className="text-cyan-400 font-mono text-xs mt-4 tracking-widest animate-pulse">
                                    COMPILED_COGNITIVE_DICT...
                                </div>
                            </div>
                        )}

                        {gameStatus === 'ready' && (
                            <div className="flex-1 flex flex-col justify-center items-center py-12 text-center space-y-6">
                                <div className="p-6 glass-panel rounded-lg border border-cyan-400/30 max-w-sm">
                                    <span className="material-symbols-outlined text-cyan-400 text-6xl mb-4 animate-bounce">
                                        volume_up
                                    </span>
                                    <h2 className="text-lg font-black text-white tracking-widest font-mono mb-2">
                                        AUDIO_INTERFACE_READY
                                    </h2>
                                    <p className="text-xs text-gray-400 leading-relaxed mb-6">
                                        Listen closely to the word read aloud by the computer. Autocorrect has been disabled completely. Use the virtual keys to spell.
                                    </p>
                                    <button
                                        onClick={() => selectNextWord(currentGrade)}
                                        className="cyber-btn w-full py-2.5 font-black text-sm tracking-widest"
                                    >
                                        INITIALIZE_ROUND
                                    </button>
                                </div>
                            </div>
                        )}

                        {(gameStatus === 'playing' || gameStatus === 'result') && (
                            <div className="flex-1 flex flex-col space-y-4">
                                
                                {/* Core Pronunciation Speaker Panel */}
                                <div className="flex-none glass-panel rounded-lg p-5 flex flex-col items-center justify-center relative overflow-hidden border-cyan-400/20">
                                    
                                    {/* Audio Controller Circles */}
                                    <div className="flex items-center justify-center gap-6 my-2">
                                        {/* Slow Mode Button */}
                                        <button
                                            onClick={() => speakCurrentWord(0.6)}
                                            className="w-10 h-10 rounded-full border border-pink-500/40 text-pink-500 flex items-center justify-center hover:bg-pink-500/10 hover:border-pink-500 transition-colors"
                                            title="Pronounce Slow (0.6x Speed)"
                                            aria-label="Slow Audio"
                                        >
                                            <span className="material-symbols-outlined text-lg">slow_motion_video</span>
                                        </button>

                                        {/* Main Speak button */}
                                        <button
                                            onClick={() => speakCurrentWord(0.85)}
                                            className={`w-20 h-20 rounded-full border-2 border-cyan-400/40 text-cyan-400 flex items-center justify-center transition-all bg-cyan-400/5 hover:bg-cyan-400/15 ${
                                                isSpeaking ? 'speaking-glow' : ''
                                            }`}
                                            title="Pronounce Word"
                                            aria-label="Speak Word"
                                        >
                                            <span className="material-symbols-outlined text-4xl">
                                                {isSpeaking ? 'graphic_eq' : 'volume_up'}
                                            </span>
                                        </button>

                                        {/* Definition speak button */}
                                        <button
                                            onClick={readDefinitionAloud}
                                            className="w-10 h-10 rounded-full border border-yellow-500/40 text-yellow-500 flex items-center justify-center hover:bg-yellow-500/10 hover:border-yellow-500 transition-colors"
                                            title="Read Bee Definition Prompt Aloud"
                                            aria-label="Read Sentence Prompt"
                                        >
                                            <span className="material-symbols-outlined text-lg">description</span>
                                        </button>
                                    </div>

                                    <div className="text-[10px] text-gray-500 font-mono tracking-widest mt-2">
                                        {isSpeaking ? "OUTPUT_VOICE_STREAMING" : "CLICK_VOICE_SPEAK_CORE"}
                                    </div>

                                    {/* Difficulty Meter */}
                                    <div className="absolute top-3 right-3 flex items-center gap-1">
                                        <span className="text-[9px] text-cyan-400 font-mono font-black">
                                            DIFF: {wordDetail.score.toFixed(1)}
                                        </span>
                                    </div>
                                </div>

                                 {/* Custom Spelling Display */}
                                 <div className="flex-none py-6 glass-panel rounded-lg flex items-center justify-center min-h-[90px] border-cyan-400/10">
                                     {gameStatus === 'playing' ? (
                                         <div className="flex items-center justify-center font-mono border-b-2 border-cyan-400/40 pb-2 px-6 max-w-full min-w-[220px]">
                                             <span className="text-xl md:text-2xl font-black text-white tracking-[0.15em] uppercase select-none">
                                                 {typedWord || ""}
                                             </span>
                                             <span className="w-2.5 h-6 bg-cyan-400 animate-[blink_1s_infinite] ml-1"></span>
                                         </div>
                                     ) : (
                                         /* Game spelling result review */
                                         <div className="text-center px-4 space-y-2">
                                             <div className="flex flex-wrap justify-center items-center gap-2">
                                                 {/* Correct neon block */}
                                                 <div className="text-xs text-gray-400 font-mono block w-full uppercase tracking-widest mb-1">
                                                     YOUR_ENTRY VS CORRECT_WORD
                                                 </div>
                                                 <div className={`text-lg md:text-xl font-black font-mono px-3 py-1.5 rounded border uppercase flex items-center gap-2 ${
                                                     isCorrect 
                                                         ? 'bg-green-500/15 border-green-500 text-green-400 shadow-[0_0_12px_rgba(34,197,94,0.35)]'
                                                         : 'bg-pink-500/15 border-pink-500 text-pink-400 line-through'
                                                 }`}>
                                                     {typedWord || "[EMPTY]"}
                                                 </div>
                                                 {!isCorrect && (
                                                     <div className="text-lg md:text-xl font-black font-mono px-3 py-1.5 rounded border border-green-500 text-green-400 bg-green-500/15 uppercase shadow-[0_0_12px_rgba(34,197,94,0.35)]">
                                                         {currentWord}
                                                     </div>
                                                 )}
                                             </div>
                                         </div>
                                     )}
                                 </div>

                                {/* Interactive Result definition panel */}
                                {gameStatus === 'result' && (
                                    <div className={`flex-1 glass-panel rounded-lg p-5 flex flex-col space-y-4 border ${
                                        isCorrect ? 'border-green-500/25 shadow-green-500/5' : 'border-pink-500/25 shadow-pink-500/5'
                                    }`}>
                                        <div className="flex-1 space-y-3 overflow-y-auto max-h-[140px] pr-1.5">
                                            <div>
                                                <span className="text-[10px] text-cyan-400 font-mono tracking-widest font-black uppercase">
                                                    LEXICAL_DEFINITION
                                                </span>
                                                <p className="text-sm text-gray-200 mt-1 font-sans leading-relaxed">
                                                    {currentDefinition || "A highly specialized word containing interesting linguistic structures."}
                                                </p>
                                            </div>

                                            {wordDetail.triggers && wordDetail.triggers.length > 0 && (
                                                <div>
                                                    <span className="text-[10px] text-pink-400 font-mono tracking-widest font-black uppercase">
                                                        LINGUISTIC_IRREGULARITIES
                                                    </span>
                                                    <div className="flex flex-wrap gap-1 mt-1">
                                                        {wordDetail.triggers.map((trig, i) => (
                                                            <span key={i} className="text-[9px] bg-pink-500/10 border border-pink-500/25 text-pink-400 px-2 py-0.5 rounded font-mono">
                                                                {trig}
                                                            </span>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </div>

                                        {/* Next word triggers */}
                                        <button
                                            onClick={() => selectNextWord(currentGrade)}
                                            className={`w-full py-3 rounded font-black text-sm tracking-widest border transition-all ${
                                                isCorrect
                                                    ? 'bg-green-500 border-green-500 text-black hover:bg-green-400 hover:border-green-400 shadow-[0_0_15px_rgba(34,197,94,0.4)]'
                                                    : 'bg-cyan-400 border-cyan-400 text-black hover:bg-cyan-300 hover:border-cyan-300 shadow-[0_0_15px_rgba(6,182,212,0.4)]'
                                            }`}
                                        >
                                            CONTINUE_CHALLENGE
                                        </button>
                                    </div>
                                )}

                                {/* Typing state virtual QWERTY keyboard */}
                                {gameStatus === 'playing' && (
                                    <div className="flex-1 flex flex-col justify-end space-y-4">
                                        
                                        {/* Submit Spelling Trigger */}
                                        <button
                                            onClick={submitSpelling}
                                            className="w-full py-2.5 rounded font-black text-xs md:text-sm tracking-widest border bg-cyan-400 border-cyan-400 text-black hover:bg-cyan-300 hover:border-cyan-300 shadow-[0_0_15px_rgba(0,243,255,0.4)] transition-all"
                                        >
                                            SUBMIT_SPELLING
                                        </button>

                                        {/* Custom Keyboard Grid */}
                                        <div className="flex-none px-0.5 pb-2">
                                            {KEYBOARD_LAYOUT.map((row, rIdx) => (
                                                <div key={rIdx} className="flex justify-center gap-1 mb-1.5 w-full">
                                                    {row.map(key => {
                                                        const isAction = key === 'BACK' || key === 'CLEAR';
                                                        return (
                                                            <button
                                                                key={key}
                                                                onClick={() => handleKey(key)}
                                                                className={`
                                                                    flex items-center justify-center rounded font-extrabold text-xs cursor-pointer select-none
                                                                    keyboard-key
                                                                    ${isAction ? 'keyboard-key-action font-bold px-2.5 flex-none text-[10px] border-pink-500/25 text-pink-400' : 'flex-1'}
                                                                    h-[46px] md:h-[52px]
                                                                `}
                                                                style={{ minWidth: isAction ? '60px' : '26px' }}
                                                            >
                                                                {key === 'BACK' ? (
                                                                    <span className="material-symbols-outlined text-sm">backspace</span>
                                                                ) : key}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                            </div>
                        )}

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
