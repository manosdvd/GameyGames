<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Clusterpuck</title>
    <script src="../timeLimit.js"></script>
    <script src="../shared/settings.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        :root {
            --bg-color: var(--cyber-bg);
            --surface-color: var(--cyber-surface);
            --text-color: var(--cyber-text);
        }

        * {
            box-sizing: border-box;
            touch-action: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Roboto', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100dvh;
            width: 100vw;
            position: relative;
        }

        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 999;
        }

        .hud-stats-bar {
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 100%;
            max-width: 600px;
            margin: 20px 0 10px 0;
            padding: 0 10px;
            z-index: 10;
        }

        .hud-stats-bar .hud-pill {
            flex: 1;
            justify-content: space-between;
            min-width: 0;
            padding: 8px 15px;
        }

        #game-wrapper {
            flex: 1;
            width: 100%;
            max-width: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            z-index: 10;
        }

        #game-container {
            position: relative;
            background: rgba(10, 10, 31, 0.4);
            border: 2px solid rgba(0, 243, 255, 0.25);
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            width: min(90vw, 50dvh);
            height: min(120vw, 65dvh);
            box-sizing: border-box;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #game-container canvas {
            width: 100% !important;
            height: 100% !important;
            border-radius: 6px;
        }

        .controls-panel {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 25px;
            padding: 0 15px;
            z-index: 10;
        }

        .controls-panel .cyber-btn {
            font-size: 0.85rem;
            letter-spacing: 1px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #win-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background: rgba(5, 5, 20, 0.96);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        #win-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .win-title {
            font-size: 3rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px var(--cyber-magenta), 0 0 35px var(--cyber-magenta);
            margin-bottom: 10px;
            letter-spacing: 4px;
            text-align: center;
        }

        .win-stats {
            font-family: 'Orbitron', monospace;
            font-size: 1.15rem;
            color: var(--cyber-cyan);
            text-shadow: var(--neon-cyan-glow);
            margin-bottom: 35px;
            text-align: center;
            line-height: 1.6;
        }

        .btn-restart {
            background: linear-gradient(135deg, var(--cyber-cyan), var(--cyber-magenta));
            border: none;
            padding: 15px 45px;
            font-size: 1.25rem;
            font-weight: 800;
            color: white;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Orbitron', sans-serif;
        }

        .btn-restart:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.6);
        }

        .btn-restart:active {
            transform: scale(0.95);
        }

        #fx-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        @media (min-width: 768px) {
            .hud-stats-bar { margin: 30px 0 20px 0; }
            .win-title { font-size: 4rem; }
        }
    </style>
</head>

<body>
    <div class="scanlines"></div>
    <canvas id="fx-canvas"></canvas>

    <header class="cyber-header" style="width: 100%;">
        <a href="../index.html" class="back-btn" id="btnBack"> &lt; HUB </a>
        <div class="hud-pill">
            <span>PROTOCOL</span>
            <span class="hud-value">CLUSTERPUCK</span>
        </div>
        <button class="icon-btn" id="btnSoundToggle" aria-label="Toggle Sound" style="pointer-events: auto;">
            <span class="material-symbols-outlined" id="soundIcon">volume_up</span>
        </button>
    </header>

    <div class="hud-stats-bar">
        <div class="hud-pill">
            <span>SCORE</span>
            <span class="hud-value" id="scoreCount">0</span>
        </div>
        <div class="hud-pill">
            <span>TARGET</span>
            <span class="hud-value" id="targetCount">CLEAN_MATRIX</span>
        </div>
    </div>

    <div id="game-wrapper">
        <div id="game-container">
            <!-- Matter.js Canvas injected here -->
        </div>
    </div>

    <div class="controls-panel">
        <button class="cyber-btn" id="btnNew">
            <span class="material-symbols-outlined" style="font-size: 1.15rem;">cached</span>
            REGENERATE
        </button>
    </div>

    <div id="win-overlay">
        <div class="win-title">PURGE_COMPLETE</div>
        <div class="win-stats" id="winStatsText">
            FINAL SCORE: 0
        </div>
        <button class="btn-restart" id="btnWinRestart">NEW_PURGE</button>
    </div>

    <script>
        let score = 0;
        const scoreCountEl = document.getElementById('scoreCount');
        const btnNew = document.getElementById('btnNew');
        const btnSoundToggle = document.getElementById('btnSoundToggle');
        const soundIconEl = document.getElementById('soundIcon');
        const winOverlayEl = document.getElementById('win-overlay');
        const winStatsTextEl = document.getElementById('winStatsText');
        const btnWinRestart = document.getElementById('btnWinRestart');
        
        const canvas = document.getElementById('fx-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function spawnParticles(x, y, color, count = 15) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0, decay: Math.random() * 0.04 + 0.02,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.vy += 0.1;
                p.life -= p.decay;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            requestAnimationFrame(animateParticles);
        }
        requestAnimationFrame(animateParticles);

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type, count = 1) {
            if (window.GameSettings && !window.GameSettings.get().sound) return;
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const now = audioCtx.currentTime;
                
                if (type === 'pop') {
                    const baseFreq = 200 + Math.min(count * 20, 600);
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(baseFreq, now);
                    osc.frequency.exponentialRampToValueAtTime(baseFreq * 2, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'over') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.linearRampToValueAtTime(50, now + 0.5);
                    gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                    osc.start(now); osc.stop(now + 0.5);
                }
            } catch (e) {}
        }

        function updateSoundButtonDisplay() {
            if (window.GameSettings) {
                const soundEnabled = window.GameSettings.get().sound;
                soundIconEl.innerText = soundEnabled ? 'volume_up' : 'volume_off';
                btnSoundToggle.style.color = soundEnabled ? 'var(--cyber-cyan)' : '#666';
            }
        }
        btnSoundToggle.addEventListener('click', () => {
            if (window.GameSettings) {
                window.GameSettings.toggle('sound');
                updateSoundButtonDisplay();
            }
        });
        updateSoundButtonDisplay();

        // --- Matter.js Physics Engine ---
        const Engine = Matter.Engine,
              Render = Matter.Render,
              Runner = Matter.Runner,
              Bodies = Matter.Bodies,
              Composite = Matter.Composite,
              Query = Matter.Query,
              Vector = Matter.Vector;

        const engine = Engine.create();
        const world = engine.world;
        const gameContainer = document.getElementById('game-container');
        
        // Logical resolution
        const width = 600;
        const height = 800;
        
        const render = Render.create({
            element: gameContainer,
            engine: engine,
            options: {
                width: width,
                height: height,
                wireframes: false,
                background: 'transparent'
            }
        });

        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        // Invisible boundaries
        const wallOptions = { isStatic: true, render: { visible: false }, friction: 0.1, restitution: 0.2 };
        const leftWall = Bodies.rectangle(-25, height/2, 50, height * 2, wallOptions);
        const rightWall = Bodies.rectangle(width + 25, height/2, 50, height * 2, wallOptions);
        const bottomWall = Bodies.rectangle(width/2, height + 25, width * 2, 50, wallOptions);
        Composite.add(world, [leftWall, rightWall, bottomWall]);

        const colorMap = ['#00f3ff', '#ff00ff', '#ffe600', '#00ff66', '#ff3333'];
        const numBalls = 90;
        // ballRadius calculated so they fit roughly 10 across
        const ballRadius = (width / 10) / 2; 

        function spawnBalls() {
            const balls = [];
            for (let i = 0; i < numBalls; i++) {
                const cIdx = Math.floor(Math.random() * colorMap.length);
                const cHex = colorMap[cIdx];
                // Scatter spawn positions above the bucket
                const x = 50 + Math.random() * (width - 100);
                const y = -100 - Math.random() * 800; 
                
                const ball = Bodies.circle(x, y, ballRadius * 0.95, {
                    restitution: 0.4,
                    friction: 0.005,
                    density: 0.04,
                    render: {
                        fillStyle: cHex,
                        strokeStyle: 'rgba(255,255,255,0.8)',
                        lineWidth: 2
                    }
                });
                ball.colorIdx = cIdx;
                ball.hexColor = cHex;
                balls.push(ball);
            }
            Composite.add(world, balls);
        }

        function initGame() {
            winOverlayEl.classList.remove('show');
            score = 0;
            scoreCountEl.innerText = score;
            
            const bodies = Composite.allBodies(world).filter(b => !b.isStatic);
            Composite.remove(world, bodies);
            
            spawnBalls();
        }

        // Tap handling
        render.canvas.addEventListener('mousedown', handleTap);
        render.canvas.addEventListener('touchstart', handleTap, {passive: true});

        function handleTap(e) {
            let clientX, clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            
            const rect = render.canvas.getBoundingClientRect();
            const scaleX = render.canvas.width / rect.width;
            const scaleY = render.canvas.height / rect.height;
            const x = (clientX - rect.left) * scaleX;
            const y = (clientY - rect.top) * scaleY;

            const bodies = Composite.allBodies(world).filter(b => !b.isStatic);
            const clicked = Query.point(bodies, { x, y })[0];
            
            if (clicked) {
                findAndDestroyCluster(clicked);
            }
        }

        let gameOverCheckTimer = null;

        function findAndDestroyCluster(startBody) {
            const targetColor = startBody.colorIdx;
            const cluster = new Set();
            const stack = [startBody];
            
            // Allow slight gap to account for jitter and resting distance
            const threshold = ballRadius * 2 + 10; 
            
            while(stack.length > 0) {
                const body = stack.pop();
                if (!cluster.has(body)) {
                    cluster.add(body);
                    const allBodies = Composite.allBodies(world).filter(b => !b.isStatic && !cluster.has(b) && b.colorIdx === targetColor);
                    
                    for (const other of allBodies) {
                        const dist = Vector.magnitude(Vector.sub(body.position, other.position));
                        if (dist < threshold) {
                            stack.push(other);
                        }
                    }
                }
            }

            if (cluster.size >= 2) {
                const bodiesToRemove = Array.from(cluster);
                Composite.remove(world, bodiesToRemove);
                
                const pts = Math.pow(cluster.size - 1, 2) * 10;
                score += pts;
                if (window.GlobalScore) window.GlobalScore.add(pts);
                scoreCountEl.innerText = score;
                
                playSound('pop', cluster.size);

                const rect = render.canvas.getBoundingClientRect();
                const scaleX = rect.width / render.canvas.width;
                const scaleY = rect.height / render.canvas.height;
                
                bodiesToRemove.forEach(b => {
                    const screenX = rect.left + b.position.x / scaleX;
                    const screenY = rect.top + b.position.y / scaleY;
                    spawnParticles(screenX, screenY, b.hexColor, 5);
                });
                
                clearTimeout(gameOverCheckTimer);
                gameOverCheckTimer = setTimeout(checkGameOver, 2000);
            }
        }

        function checkGameOver() {
            const bodies = Composite.allBodies(world).filter(b => !b.isStatic);
            let hasMoves = false;
            const threshold = ballRadius * 2 + 15; 

            for (let i = 0; i < bodies.length; i++) {
                const b1 = bodies[i];
                for (let j = i + 1; j < bodies.length; j++) {
                    const b2 = bodies[j];
                    if (b1.colorIdx === b2.colorIdx) {
                        const dist = Vector.magnitude(Vector.sub(b1.position, b2.position));
                        if (dist < threshold) {
                            hasMoves = true;
                            break;
                        }
                    }
                }
                if (hasMoves) break;
            }

            if (!hasMoves) {
                if (bodies.length === 0) {
                    score += 1000;
                    if (window.GlobalScore) window.GlobalScore.add(1000);
                }
                playSound('over');
                winStatsTextEl.innerText = `FINAL SCORE: ${score}${bodies.length === 0 ? '\\nMATRIX PERFECTLY CLEARED!' : ''}`;
                winOverlayEl.classList.add('show');
            }
        }

        btnNew.addEventListener('click', initGame);
        btnWinRestart.addEventListener('click', initGame);

        initGame();
    </script>
</body>
</html>
