<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cluster Purge</title>
    <script src="../timeLimit.js"></script>
    <script src="../shared/settings.js"></script>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        :root {
            --bg-color: var(--cyber-bg);
            --surface-color: var(--cyber-surface);
            --text-color: var(--cyber-text);
        }

        * {
            box-sizing: border-box;
            touch-action: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Roboto', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100dvh;
            width: 100vw;
            position: relative;
        }

        /* --- Scanlines Backdrop --- */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 999;
        }

        /* --- HUD Stats Bar --- */
        .hud-stats-bar {
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 100%;
            max-width: 600px;
            margin: 20px 0 10px 0;
            padding: 0 10px;
            z-index: 10;
        }

        .hud-stats-bar .hud-pill {
            flex: 1;
            justify-content: space-between;
            min-width: 0;
            padding: 8px 15px;
        }

        /* --- Main Game Area --- */
        #game-wrapper {
            flex: 1;
            width: 100%;
            max-width: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            z-index: 10;
        }

        #game-container {
            position: relative;
            background: rgba(10, 10, 31, 0.4);
            border: 2px solid rgba(0, 243, 255, 0.25);
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            width: min(85vw, 48dvh);
            height: min(85vw, 48dvh);
            padding: 8px;
            box-sizing: border-box;
        }

        #game-board {
            display: grid;
            gap: 2px;
            width: 100%;
            height: 100%;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
        }

        /* --- Grid Cells --- */
        .cell {
            position: relative;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            transform: scale(0.9);
            box-shadow: inset 0 0 10px rgba(255,255,255,0.2), 0 0 5px rgba(0,0,0,0.5);
        }
        
        .cell:hover {
            transform: scale(1.0);
            box-shadow: inset 0 0 15px rgba(255,255,255,0.4), 0 0 10px currentColor;
        }

        .cell.empty {
            opacity: 0;
            pointer-events: none;
        }

        /* Colors */
        .color-0 { background: #00f3ff; color: #00f3ff; }
        .color-1 { background: #ff00ff; color: #ff00ff; }
        .color-2 { background: #ffe600; color: #ffe600; }
        .color-3 { background: #00ff66; color: #00ff66; }
        .color-4 { background: #ff3333; color: #ff3333; }

        /* --- Button Controls --- */
        .controls-panel {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 25px;
            padding: 0 15px;
            z-index: 10;
        }

        .controls-panel .cyber-btn {
            font-size: 0.85rem;
            letter-spacing: 1px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* --- Win Overlay --- */
        #win-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background: rgba(5, 5, 20, 0.96);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        #win-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .win-title {
            font-size: 3rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px var(--cyber-magenta), 0 0 35px var(--cyber-magenta);
            margin-bottom: 10px;
            letter-spacing: 4px;
        }

        .win-stats {
            font-family: 'Orbitron', monospace;
            font-size: 1.15rem;
            color: var(--cyber-cyan);
            text-shadow: var(--neon-cyan-glow);
            margin-bottom: 35px;
            text-align: center;
            line-height: 1.6;
        }

        .btn-restart {
            background: linear-gradient(135deg, var(--cyber-cyan), var(--cyber-magenta));
            border: none;
            padding: 15px 45px;
            font-size: 1.25rem;
            font-weight: 800;
            color: white;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Orbitron', sans-serif;
        }

        .btn-restart:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.6);
        }

        .btn-restart:active {
            transform: scale(0.95);
        }

        /* --- FX Canvas --- */
        #fx-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        @media (min-width: 768px) {
            .hud-stats-bar { margin: 30px 0 20px 0; }
            .win-title { font-size: 4rem; }
        }
    </style>
</head>

<body>
    <div class="scanlines"></div>
    <canvas id="fx-canvas"></canvas>

    <!-- Header -->
    <header class="cyber-header" style="width: 100%;">
        <a href="../index.html" class="back-btn" id="btnBack"> &lt; HUB </a>
        <div class="hud-pill">
            <span>PROTOCOL</span>
            <span class="hud-value">CLUSTER_PURGE</span>
        </div>
        <button class="icon-btn" id="btnSoundToggle" aria-label="Toggle Sound" style="pointer-events: auto;">
            <span class="material-symbols-outlined" id="soundIcon">volume_up</span>
        </button>
    </header>

    <!-- HUD Stats -->
    <div class="hud-stats-bar">
        <div class="hud-pill">
            <span>SCORE</span>
            <span class="hud-value" id="scoreCount">0</span>
        </div>
        <div class="hud-pill">
            <span>TARGET</span>
            <span class="hud-value" id="targetCount">CLEAN_MATRIX</span>
        </div>
    </div>

    <!-- Game Board Wrapper -->
    <div id="game-wrapper">
        <div id="game-container">
            <div id="game-board"></div>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls-panel">
        <button class="cyber-btn" id="btnNew">
            <span class="material-symbols-outlined" style="font-size: 1.15rem;">cached</span>
            REGENERATE
        </button>
    </div>

    <!-- Win Overlay -->
    <div id="win-overlay">
        <div class="win-title">PURGE_COMPLETE</div>
        <div class="win-stats" id="winStatsText">
            FINAL SCORE: 0
        </div>
        <button class="btn-restart" id="btnWinRestart">NEW_PURGE</button>
    </div>

    <script>
        // --- Core Setup & State ---
        const ROWS = 10;
        const COLS = 10;
        const COLORS = 5;
        let grid = []; // 2D array [row][col]
        let score = 0;
        
        const boardEl = document.getElementById('game-board');
        const scoreCountEl = document.getElementById('scoreCount');
        const btnNew = document.getElementById('btnNew');
        const btnSoundToggle = document.getElementById('btnSoundToggle');
        const soundIconEl = document.getElementById('soundIcon');
        const winOverlayEl = document.getElementById('win-overlay');
        const winStatsTextEl = document.getElementById('winStatsText');
        const btnWinRestart = document.getElementById('btnWinRestart');
        
        const canvas = document.getElementById('fx-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function spawnParticles(x, y, color, count = 15) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0, decay: Math.random() * 0.04 + 0.02,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.vy += 0.1; // gravity
                p.life -= p.decay;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            requestAnimationFrame(animateParticles);
        }
        requestAnimationFrame(animateParticles);

        // --- Sound System ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type, count = 1) {
            if (window.GameSettings && !window.GameSettings.get().sound) return;
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const now = audioCtx.currentTime;
                
                if (type === 'pop') {
                    // Pitch goes up with cluster size
                    const baseFreq = 200 + Math.min(count * 20, 600);
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(baseFreq, now);
                    osc.frequency.exponentialRampToValueAtTime(baseFreq * 2, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'over') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.linearRampToValueAtTime(50, now + 0.5);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                }
            } catch (e) {
                console.warn('Audio Context blocked or failed:', e);
            }
        }

        function updateSoundButtonDisplay() {
            if (window.GameSettings) {
                const soundEnabled = window.GameSettings.get().sound;
                soundIconEl.innerText = soundEnabled ? 'volume_up' : 'volume_off';
                btnSoundToggle.style.color = soundEnabled ? 'var(--cyber-cyan)' : '#666';
            }
        }
        btnSoundToggle.addEventListener('click', () => {
            if (window.GameSettings) {
                window.GameSettings.toggle('sound');
                updateSoundButtonDisplay();
            }
        });
        updateSoundButtonDisplay();

        // --- Game Logic ---
        function initGame() {
            winOverlayEl.classList.remove('show');
            score = 0;
            scoreCountEl.innerText = score;
            
            grid = [];
            for (let r = 0; r < ROWS; r++) {
                grid[r] = [];
                for (let c = 0; c < COLS; c++) {
                    grid[r][c] = Math.floor(Math.random() * COLORS);
                }
            }
            renderBoard();
        }

        const colorMap = ['#00f3ff', '#ff00ff', '#ffe600', '#00ff66', '#ff3333'];

        function renderBoard() {
            boardEl.innerHTML = '';
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const val = grid[r][c];
                    const el = document.createElement('div');
                    el.className = 'cell ' + (val === -1 ? 'empty' : 'color-' + val);
                    el.dataset.r = r;
                    el.dataset.c = c;
                    
                    if (val !== -1) {
                        el.addEventListener('click', () => handleCellClick(r, c));
                    }
                    boardEl.appendChild(el);
                }
            }
        }

        function handleCellClick(r, c) {
            const targetColor = grid[r][c];
            if (targetColor === -1) return;

            const cluster = [];
            const visited = new Set();
            const stack = [[r, c]];
            
            while (stack.length > 0) {
                const [cr, cc] = stack.pop();
                const key = `${cr},${cc}`;
                if (!visited.has(key)) {
                    visited.add(key);
                    cluster.push([cr, cc]);
                    
                    const neighbors = [
                        [cr-1, cc], [cr+1, cc], [cr, cc-1], [cr, cc+1]
                    ];
                    for (const [nr, nc] of neighbors) {
                        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                            if (grid[nr][nc] === targetColor && !visited.has(`${nr},${nc}`)) {
                                stack.push([nr, nc]);
                            }
                        }
                    }
                }
            }

            if (cluster.length >= 2) {
                // Remove cluster
                let colorHex = colorMap[targetColor];
                
                // Add points: (N-2)^2 * 10
                const pts = Math.pow(cluster.length - 1, 2) * 10;
                score += pts;
                if (window.GlobalScore) window.GlobalScore.add(pts);
                scoreCountEl.innerText = score;
                
                cluster.forEach(([cr, cc]) => {
                    grid[cr][cc] = -1; // Empty
                    
                    // particles
                    const domCell = document.querySelector(`.cell[data-r="${cr}"][data-c="${cc}"]`);
                    if (domCell) {
                        const rect = domCell.getBoundingClientRect();
                        spawnParticles(rect.left + rect.width/2, rect.top + rect.height/2, colorHex, 5);
                    }
                });

                playSound('pop', cluster.length);
                applyGravity();
            }
        }

        function applyGravity() {
            // Drop down
            for (let c = 0; c < COLS; c++) {
                let writeR = ROWS - 1;
                for (let r = ROWS - 1; r >= 0; r--) {
                    if (grid[r][c] !== -1) {
                        grid[writeR][c] = grid[r][c];
                        if (writeR !== r) {
                            grid[r][c] = -1;
                        }
                        writeR--;
                    }
                }
            }
            
            // Shift left if column empty
            let writeC = 0;
            for (let c = 0; c < COLS; c++) {
                // Check if column is empty
                let isEmpty = true;
                for (let r = 0; r < ROWS; r++) {
                    if (grid[r][c] !== -1) isEmpty = false;
                }
                
                if (!isEmpty) {
                    if (writeC !== c) {
                        for (let r = 0; r < ROWS; r++) {
                            grid[r][writeC] = grid[r][c];
                            grid[r][c] = -1;
                        }
                    }
                    writeC++;
                }
            }
            
            renderBoard();
            checkGameOver();
        }

        function checkGameOver() {
            let hasMoves = false;
            let blocksLeft = 0;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (grid[r][c] !== -1) {
                        blocksLeft++;
                        const color = grid[r][c];
                        // Check right and down
                        if (c < COLS - 1 && grid[r][c+1] === color) hasMoves = true;
                        if (r < ROWS - 1 && grid[r+1][c] === color) hasMoves = true;
                    }
                }
            }
            
            if (!hasMoves) {
                if (blocksLeft === 0) {
                    score += 1000; // bonus for clear
                    if (window.GlobalScore) window.GlobalScore.add(1000);
                }
                playSound('over');
                winStatsTextEl.innerText = `FINAL SCORE: ${score}${blocksLeft === 0 ? '\\nMATRIX PERFECTLY CLEARED!' : ''}`;
                winOverlayEl.classList.add('show');
            }
        }

        btnNew.addEventListener('click', initGame);
        btnWinRestart.addEventListener('click', initGame);

        // Initialize
        initGame();
    </script>
</body>

</html>
