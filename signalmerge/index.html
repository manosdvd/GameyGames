<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Signal Merge</title>
    <script src="../timeLimit.js"></script>
    <script src="../shared/settings.js"></script>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        :root {
            --bg-color: var(--cyber-bg);
            --surface-color: var(--cyber-surface);
            --text-color: var(--cyber-text);
        }

        * {
            box-sizing: border-box;
            touch-action: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Roboto', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100dvh;
            width: 100vw;
            position: relative;
        }

        /* --- Scanlines Backdrop --- */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 999;
        }

        /* --- HUD Stats Bar --- */
        .hud-stats-bar {
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 100%;
            max-width: 600px;
            margin: 20px 0 10px 0;
            padding: 0 10px;
            z-index: 10;
        }

        .hud-stats-bar .hud-pill {
            flex: 1;
            justify-content: space-between;
            min-width: 0;
            padding: 8px 15px;
        }

        /* --- Main Game Area --- */
        #game-wrapper {
            flex: 1;
            width: 100%;
            max-width: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            z-index: 10;
        }

        #game-container {
            position: relative;
            background: rgba(10, 10, 31, 0.4);
            border: 2px solid rgba(0, 243, 255, 0.25);
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            width: min(85vw, 48dvh);
            height: min(85vw, 48dvh);
            padding: 8px;
            box-sizing: border-box;
        }

        #game-board {
            position: relative;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            border-radius: 6px;
        }

        /* Grid Background Cells */
        .grid-bg {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            width: 100%;
            height: 100%;
            gap: 8px;
            position: absolute;
            top: 0; left: 0;
        }
        .grid-bg-cell {
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
        }

        /* Tiles Container */
        #tiles-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        .tile {
            position: absolute;
            width: calc(25% - 6px); /* roughly factoring gap */
            height: calc(25% - 6px);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 1.6rem;
            transition: transform 0.1s ease-in-out;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .tile-new {
            animation: pop 0.2s ease-in-out;
        }
        .tile-merged {
            animation: mergePop 0.2s ease-in-out;
            z-index: 5;
        }

        @keyframes pop {
            0% { transform: scale(0); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes mergePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); box-shadow: 0 0 20px rgba(255,255,255,0.8); }
            100% { transform: scale(1); }
        }

        /* Colors by value */
        .val-2 { background: #002233; color: #00f3ff; border-color: #00f3ff; text-shadow: 0 0 5px #00f3ff; }
        .val-4 { background: #003344; color: #00f3ff; border-color: #00f3ff; text-shadow: 0 0 5px #00f3ff; }
        .val-8 { background: #004455; color: #00ff66; border-color: #00ff66; text-shadow: 0 0 5px #00ff66; }
        .val-16 { background: #005544; color: #00ff66; border-color: #00ff66; text-shadow: 0 0 5px #00ff66; }
        .val-32 { background: #334400; color: #ffe600; border-color: #ffe600; text-shadow: 0 0 5px #ffe600; }
        .val-64 { background: #443300; color: #ffe600; border-color: #ffe600; text-shadow: 0 0 5px #ffe600; }
        .val-128 { background: #552200; color: #ff9900; border-color: #ff9900; text-shadow: 0 0 8px #ff9900; box-shadow: 0 0 10px rgba(255,153,0,0.3); font-size: 1.4rem; }
        .val-256 { background: #661100; color: #ff3333; border-color: #ff3333; text-shadow: 0 0 8px #ff3333; box-shadow: 0 0 10px rgba(255,51,51,0.3); font-size: 1.4rem; }
        .val-512 { background: #550022; color: #ff00ff; border-color: #ff00ff; text-shadow: 0 0 8px #ff00ff; box-shadow: 0 0 15px rgba(255,0,255,0.4); font-size: 1.4rem; }
        .val-1024 { background: #330044; color: #cc00ff; border-color: #cc00ff; text-shadow: 0 0 10px #cc00ff; box-shadow: 0 0 15px rgba(204,0,255,0.4); font-size: 1.2rem; }
        .val-2048 { background: #000; color: #fff; border-color: #fff; text-shadow: 0 0 15px #fff; box-shadow: 0 0 25px rgba(255,255,255,0.8); font-size: 1.2rem; }
        .val-super { background: #fff; color: #000; border-color: #000; box-shadow: 0 0 30px #fff; font-size: 1.1rem; }

        /* --- Button Controls --- */
        .controls-panel {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 25px;
            padding: 0 15px;
            z-index: 10;
        }

        .controls-panel .cyber-btn {
            font-size: 0.85rem;
            letter-spacing: 1px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* --- Win Overlay --- */
        #win-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background: rgba(5, 5, 20, 0.96);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        #win-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .win-title {
            font-size: 3rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px var(--cyber-cyan), 0 0 35px var(--cyber-cyan);
            margin-bottom: 10px;
            letter-spacing: 4px;
            text-align: center;
        }

        .win-stats {
            font-family: 'Orbitron', monospace;
            font-size: 1.15rem;
            color: var(--cyber-magenta);
            text-shadow: var(--neon-magenta-glow);
            margin-bottom: 35px;
            text-align: center;
            line-height: 1.6;
        }

        .btn-restart {
            background: linear-gradient(135deg, var(--cyber-magenta), var(--cyber-cyan));
            border: none;
            padding: 15px 45px;
            font-size: 1.25rem;
            font-weight: 800;
            color: white;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Orbitron', sans-serif;
        }

        .btn-restart:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(255, 0, 255, 0.6);
        }

        .btn-restart:active {
            transform: scale(0.95);
        }

        @media (min-width: 768px) {
            .hud-stats-bar { margin: 30px 0 20px 0; }
            .win-title { font-size: 4rem; }
        }
    </style>
</head>

<body>
    <div class="scanlines"></div>

    <!-- Header -->
    <header class="cyber-header" style="width: 100%;">
        <a href="../index.html" class="back-btn" id="btnBack"> &lt; HUB </a>
        <div class="hud-pill">
            <span>PROTOCOL</span>
            <span class="hud-value">SIGNAL_MERGE</span>
        </div>
        <button class="icon-btn" id="btnSoundToggle" aria-label="Toggle Sound" style="pointer-events: auto;">
            <span class="material-symbols-outlined" id="soundIcon">volume_up</span>
        </button>
    </header>

    <!-- HUD Stats -->
    <div class="hud-stats-bar">
        <div class="hud-pill">
            <span>SIGNAL</span>
            <span class="hud-value" id="scoreCount">0</span>
        </div>
        <div class="hud-pill">
            <span>PEAK</span>
            <span class="hud-value" id="bestCount">0</span>
        </div>
    </div>

    <!-- Game Board Wrapper -->
    <div id="game-wrapper">
        <div id="game-container">
            <div id="game-board">
                <div class="grid-bg">
                    <div class="grid-bg-cell"></div><div class="grid-bg-cell"></div><div class="grid-bg-cell"></div><div class="grid-bg-cell"></div>
                    <div class="grid-bg-cell"></div><div class="grid-bg-cell"></div><div class="grid-bg-cell"></div><div class="grid-bg-cell"></div>
                    <div class="grid-bg-cell"></div><div class="grid-bg-cell"></div><div class="grid-bg-cell"></div><div class="grid-bg-cell"></div>
                    <div class="grid-bg-cell"></div><div class="grid-bg-cell"></div><div class="grid-bg-cell"></div><div class="grid-bg-cell"></div>
                </div>
                <div id="tiles-container"></div>
            </div>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls-panel">
        <button class="cyber-btn" id="btnNew">
            <span class="material-symbols-outlined" style="font-size: 1.15rem;">cached</span>
            REBOOT
        </button>
    </div>

    <!-- Win Overlay -->
    <div id="win-overlay">
        <div class="win-title" id="winTitleText">SIGNAL_LOSS</div>
        <div class="win-stats" id="winStatsText">
            PEAK STRENGTH: 0
        </div>
        <button class="btn-restart" id="btnWinRestart">REBOOT_SYSTEM</button>
    </div>

    <script>
        const N = 4;
        let board = [];
        let score = 0;
        let best = localStorage.getItem('signalMergeBest') || 0;
        let hasWon = false;
        
        const tilesContainer = document.getElementById('tiles-container');
        const scoreCountEl = document.getElementById('scoreCount');
        const bestCountEl = document.getElementById('bestCount');
        const btnNew = document.getElementById('btnNew');
        const btnSoundToggle = document.getElementById('btnSoundToggle');
        const soundIconEl = document.getElementById('soundIcon');
        const winOverlayEl = document.getElementById('win-overlay');
        const winTitleTextEl = document.getElementById('winTitleText');
        const winStatsTextEl = document.getElementById('winStatsText');
        const btnWinRestart = document.getElementById('btnWinRestart');

        bestCountEl.innerText = best;

        // --- Sound System ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type, strength = 1) {
            if (window.GameSettings && !window.GameSettings.get().sound) return;
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const now = audioCtx.currentTime;
                
                if (type === 'move') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.05);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'merge') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.type = 'triangle';
                    
                    // Pitch correlates with merge strength
                    const freq = 200 + (Math.log2(strength) * 50);
                    
                    osc.frequency.setValueAtTime(freq, now);
                    osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + 0.1);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'gameover') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(50, now + 0.5);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                }
            } catch (e) {}
        }

        function updateSoundButtonDisplay() {
            if (window.GameSettings) {
                const soundEnabled = window.GameSettings.get().sound;
                soundIconEl.innerText = soundEnabled ? 'volume_up' : 'volume_off';
                btnSoundToggle.style.color = soundEnabled ? 'var(--cyber-cyan)' : '#666';
            }
        }
        btnSoundToggle.addEventListener('click', () => {
            if (window.GameSettings) {
                window.GameSettings.toggle('sound');
                updateSoundButtonDisplay();
            }
        });
        updateSoundButtonDisplay();

        // --- Game Logic ---
        function initGame() {
            winOverlayEl.classList.remove('show');
            score = 0;
            scoreCountEl.innerText = score;
            hasWon = false;
            
            board = Array(N).fill().map(() => Array(N).fill(0));
            tilesContainer.innerHTML = '';
            
            spawnTile();
            spawnTile();
            renderTiles();
        }

        function spawnTile() {
            const empty = [];
            for(let r=0; r<N; r++){
                for(let c=0; c<N; c++){
                    if(board[r][c] === 0) empty.push({r, c});
                }
            }
            if(empty.length === 0) return;
            const spot = empty[Math.floor(Math.random() * empty.length)];
            board[spot.r][spot.c] = Math.random() < 0.9 ? 2 : 4;
            
            // Render new tile specifically so it can animate in
            createTileDOM(spot.r, spot.c, board[spot.r][spot.c], true);
        }

        function createTileDOM(r, c, val, isNew = false, isMerged = false) {
            const el = document.createElement('div');
            el.className = `tile val-${val > 2048 ? 'super' : val}`;
            if (isNew) el.classList.add('tile-new');
            if (isMerged) el.classList.add('tile-merged');
            
            // Calculate absolute position
            // gap is 8px. 
            // 4 cols: gap counts = 3.
            // Width of tile = 25% - 6px (since 3 * 8 = 24 / 4 = 6)
            // Left offset = col * 25% + col * 2px (wait, let's keep it simple with pure percentages + calc)
            el.style.left = `calc(${c * 25}% + ${c * 2}px + 2px)`; 
            el.style.top = `calc(${r * 25}% + ${r * 2}px + 2px)`;
            
            el.innerText = val;
            el.id = `tile-${r}-${c}`;
            tilesContainer.appendChild(el);
        }

        function renderTiles() {
            tilesContainer.innerHTML = '';
            for(let r=0; r<N; r++){
                for(let c=0; c<N; c++){
                    if(board[r][c] !== 0) {
                        createTileDOM(r, c, board[r][c]);
                    }
                }
            }
        }

        // --- Move Logic ---
        function move(direction) {
            let moved = false;
            let mergeMax = 0;
            
            // clone board to calculate animations if we wanted, but we'll do simple re-render
            const newBoard = Array(N).fill().map(() => Array(N).fill(0));
            const merged = Array(N).fill().map(() => Array(N).fill(false));
            
            const traverse = [];
            for(let i=0; i<N; i++) traverse.push(i);
            
            const traverseR = direction === 'down' ? [...traverse].reverse() : traverse;
            const traverseC = direction === 'right' ? [...traverse].reverse() : traverse;
            
            traverseR.forEach(r => {
                traverseC.forEach(c => {
                    if (board[r][c] !== 0) {
                        let currR = r;
                        let currC = c;
                        let dr = direction === 'up' ? -1 : (direction === 'down' ? 1 : 0);
                        let dc = direction === 'left' ? -1 : (direction === 'right' ? 1 : 0);
                        
                        while (currR + dr >= 0 && currR + dr < N && currC + dc >= 0 && currC + dc < N && newBoard[currR + dr][currC + dc] === 0) {
                            currR += dr;
                            currC += dc;
                        }
                        
                        if (currR + dr >= 0 && currR + dr < N && currC + dc >= 0 && currC + dc < N && newBoard[currR + dr][currC + dc] === board[r][c] && !merged[currR + dr][currC + dc]) {
                            // Merge
                            newBoard[currR + dr][currC + dc] *= 2;
                            let mergePoints = newBoard[currR + dr][currC + dc];
                            score += mergePoints;
                            if (window.GlobalScore) window.GlobalScore.add(mergePoints);
                            newBoard[currR][currC] = 0;
                            merged[currR + dr][currC + dc] = true;
                            moved = true;
                            if (newBoard[currR + dr][currC + dc] > mergeMax) mergeMax = newBoard[currR + dr][currC + dc];
                            
                            if (newBoard[currR + dr][currC + dc] === 2048 && !hasWon) {
                                hasWon = true; // Optional logic for continuing
                            }
                        } else {
                            newBoard[currR][currC] = board[r][c];
                            if (currR !== r || currC !== c) moved = true;
                        }
                    }
                });
            });
            
            if (moved) {
                board = newBoard;
                scoreCountEl.innerText = score;
                if (score > best) {
                    best = score;
                    localStorage.setItem('signalMergeBest', best);
                    bestCountEl.innerText = best;
                }
                
                if (mergeMax > 0) playSound('merge', mergeMax);
                else playSound('move');
                
                // Re-render
                tilesContainer.innerHTML = '';
                for(let r=0; r<N; r++){
                    for(let c=0; c<N; c++){
                        if(board[r][c] !== 0) {
                            createTileDOM(r, c, board[r][c], false, merged[r][c]);
                        }
                    }
                }
                
                setTimeout(() => {
                    spawnTile();
                    checkGameOver();
                }, 100);
            }
        }

        function checkGameOver() {
            let movesLeft = false;
            for(let r=0; r<N; r++){
                for(let c=0; c<N; c++){
                    if(board[r][c] === 0) movesLeft = true;
                    if(c < N-1 && board[r][c] === board[r][c+1]) movesLeft = true;
                    if(r < N-1 && board[r][c] === board[r+1][c]) movesLeft = true;
                }
            }
            if(!movesLeft) {
                playSound('gameover');
                winTitleTextEl.innerText = "SIGNAL_LOSS";
                winTitleTextEl.style.color = "var(--cyber-magenta)";
                winTitleTextEl.style.textShadow = "var(--neon-magenta-glow)";
                winStatsTextEl.innerText = `PEAK STRENGTH: ${score}`;
                winOverlayEl.classList.add('show');
            }
        }

        // --- Inputs ---
        document.addEventListener('keydown', e => {
            if (winOverlayEl.classList.contains('show')) return;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
            if (e.key === 'ArrowUp') move('up');
            else if (e.key === 'ArrowDown') move('down');
            else if (e.key === 'ArrowLeft') move('left');
            else if (e.key === 'ArrowRight') move('right');
        });

        let touchStartX = 0, touchStartY = 0;
        boardEl = document.getElementById('game-board'); // reassign just in case
        boardEl.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: true});
        
        boardEl.addEventListener('touchend', e => {
            if (winOverlayEl.classList.contains('show')) return;
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                if (Math.abs(dx) > 30) {
                    if (dx > 0) move('right');
                    else move('left');
                }
            } else {
                if (Math.abs(dy) > 30) {
                    if (dy > 0) move('down');
                    else move('up');
                }
            }
        }, {passive: true});

        btnNew.addEventListener('click', initGame);
        btnWinRestart.addEventListener('click', initGame);

        // Initialize
        initGame();
    </script>
</body>

</html>
