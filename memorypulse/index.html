<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Memory Pulse</title>
    <script src="../timeLimit.js"></script>
    <script src="../shared/settings.js"></script>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        :root {
            --bg-color: var(--cyber-bg);
            --surface-color: var(--cyber-surface);
            --text-color: var(--cyber-text);
        }

        * {
            box-sizing: border-box;
            touch-action: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Roboto', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100dvh;
            width: 100vw;
            position: relative;
        }

        /* --- Scanlines Backdrop --- */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 999;
        }

        /* --- HUD Stats Bar --- */
        .hud-stats-bar {
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 100%;
            max-width: 600px;
            margin: 20px 0 10px 0;
            padding: 0 10px;
            z-index: 10;
        }

        .hud-stats-bar .hud-pill {
            flex: 1;
            justify-content: space-between;
            min-width: 0;
            padding: 8px 15px;
        }

        /* --- Main Game Area --- */
        #game-wrapper {
            flex: 1;
            width: 100%;
            max-width: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            z-index: 10;
        }

        #game-container {
            position: relative;
            background: rgba(10, 10, 31, 0.4);
            border: 2px solid rgba(0, 243, 255, 0.25);
            border-radius: 50%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            width: min(85vw, 48dvh);
            height: min(85vw, 48dvh);
            padding: 15px;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 15px;
            overflow: hidden;
        }

        .pulse-pad {
            position: relative;
            border-radius: 8px;
            background: rgba(20, 20, 20, 0.8);
            border: 2px solid #333;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .pad-tl { border-top-left-radius: 100%; }
        .pad-tr { border-top-right-radius: 100%; }
        .pad-bl { border-bottom-left-radius: 100%; }
        .pad-br { border-bottom-right-radius: 100%; }

        .pulse-pad.active {
            filter: brightness(2);
            transform: scale(0.98);
        }

        .color-0 { border-color: var(--cyber-cyan); }
        .color-0.active { background: var(--cyber-cyan); box-shadow: 0 0 30px var(--cyber-cyan); }
        
        .color-1 { border-color: var(--cyber-magenta); }
        .color-1.active { background: var(--cyber-magenta); box-shadow: 0 0 30px var(--cyber-magenta); }
        
        .color-2 { border-color: var(--cyber-yellow); }
        .color-2.active { background: var(--cyber-yellow); box-shadow: 0 0 30px var(--cyber-yellow); }
        
        .color-3 { border-color: #00ff66; }
        .color-3.active { background: #00ff66; box-shadow: 0 0 30px #00ff66; }

        /* Central core */
        .core {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 30%; height: 30%;
            background: #111;
            border-radius: 50%;
            border: 2px solid #555;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: #fff;
            box-shadow: 0 0 20px #000;
        }

        .core.playing { border-color: var(--cyber-yellow); box-shadow: 0 0 20px var(--cyber-yellow); color: var(--cyber-yellow); }
        .core.listening { border-color: var(--cyber-cyan); box-shadow: 0 0 20px var(--cyber-cyan); color: var(--cyber-cyan); }
        .core.error { border-color: red; box-shadow: 0 0 20px red; color: red; }

        /* --- Button Controls --- */
        .controls-panel {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 25px;
            padding: 0 15px;
            z-index: 10;
        }

        .controls-panel .cyber-btn {
            font-size: 0.85rem;
            letter-spacing: 1px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* --- Win Overlay --- */
        #win-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background: rgba(5, 5, 20, 0.96);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        #win-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .win-title {
            font-size: 3rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px red, 0 0 35px red;
            margin-bottom: 10px;
            letter-spacing: 4px;
        }

        .win-stats {
            font-family: 'Orbitron', monospace;
            font-size: 1.15rem;
            color: var(--cyber-magenta);
            text-shadow: var(--neon-magenta-glow);
            margin-bottom: 35px;
            text-align: center;
            line-height: 1.6;
        }

        .btn-restart {
            background: linear-gradient(135deg, var(--cyber-magenta), var(--cyber-cyan));
            border: none;
            padding: 15px 45px;
            font-size: 1.25rem;
            font-weight: 800;
            color: white;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Orbitron', sans-serif;
        }

        .btn-restart:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(255, 0, 255, 0.6);
        }

        .btn-restart:active {
            transform: scale(0.95);
        }

        @media (min-width: 768px) {
            .hud-stats-bar { margin: 30px 0 20px 0; }
            .win-title { font-size: 4rem; }
        }
    </style>
</head>

<body>
    <div class="scanlines"></div>

    <!-- Header -->
    <header class="cyber-header" style="width: 100%;">
        <a href="../index.html" class="back-btn" id="btnBack"> &lt; HUB </a>
        <div class="hud-pill">
            <span>PROTOCOL</span>
            <span class="hud-value">PULSE_MEMORY</span>
        </div>
        <button class="icon-btn" id="btnSoundToggle" aria-label="Toggle Sound" style="pointer-events: auto;">
            <span class="material-symbols-outlined" id="soundIcon">volume_up</span>
        </button>
    </header>

    <!-- HUD Stats -->
    <div class="hud-stats-bar">
        <div class="hud-pill">
            <span>LEVEL</span>
            <span class="hud-value" id="scoreCount">1</span>
        </div>
        <div class="hud-pill">
            <span>PEAK</span>
            <span class="hud-value" id="bestCount">1</span>
        </div>
    </div>

    <!-- Game Board Wrapper -->
    <div id="game-wrapper">
        <div id="game-container">
            <div class="pulse-pad pad-tl color-0" data-id="0"></div>
            <div class="pulse-pad pad-tr color-1" data-id="1"></div>
            <div class="pulse-pad pad-bl color-2" data-id="2"></div>
            <div class="pulse-pad pad-br color-3" data-id="3"></div>
            <div class="core" id="coreEl">--</div>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls-panel">
        <button class="cyber-btn" id="btnNew">
            <span class="material-symbols-outlined" style="font-size: 1.15rem;">play_arrow</span>
            START
        </button>
    </div>

    <!-- Win Overlay -->
    <div id="win-overlay">
        <div class="win-title" id="winTitleText">SIGNAL_LOST</div>
        <div class="win-stats" id="winStatsText">
            SEQUENCE FAILED AT LEVEL 1
        </div>
        <button class="btn-restart" id="btnWinRestart">REBOOT_SYSTEM</button>
    </div>

    <script>
        let sequence = [];
        let playerStep = 0;
        let score = 0;
        let best = localStorage.getItem('memoryPulseBest') || 0;
        let isPlaying = false;
        let playerCanClick = false;
        
        const pads = document.querySelectorAll('.pulse-pad');
        const coreEl = document.getElementById('coreEl');
        const scoreCountEl = document.getElementById('scoreCount');
        const bestCountEl = document.getElementById('bestCount');
        const btnNew = document.getElementById('btnNew');
        const btnSoundToggle = document.getElementById('btnSoundToggle');
        const soundIconEl = document.getElementById('soundIcon');
        const winOverlayEl = document.getElementById('win-overlay');
        const winStatsTextEl = document.getElementById('winStatsText');
        const btnWinRestart = document.getElementById('btnWinRestart');

        bestCountEl.innerText = best;

        // --- Sound System ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        const padFrequencies = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5

        function playSound(type, padId = 0) {
            if (window.GameSettings && !window.GameSettings.get().sound) return;
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const now = audioCtx.currentTime;
                
                if (type === 'pad') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(padFrequencies[padId], now);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'error') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(80, now + 0.5);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                }
            } catch (e) {}
        }

        function updateSoundButtonDisplay() {
            if (window.GameSettings) {
                const soundEnabled = window.GameSettings.get().sound;
                soundIconEl.innerText = soundEnabled ? 'volume_up' : 'volume_off';
                btnSoundToggle.style.color = soundEnabled ? 'var(--cyber-cyan)' : '#666';
            }
        }
        btnSoundToggle.addEventListener('click', () => {
            if (window.GameSettings) {
                window.GameSettings.toggle('sound');
                updateSoundButtonDisplay();
            }
        });
        updateSoundButtonDisplay();

        // --- Game Logic ---
        function initGame() {
            winOverlayEl.classList.remove('show');
            sequence = [];
            score = 0;
            scoreCountEl.innerText = '1';
            isPlaying = true;
            coreEl.innerText = '--';
            coreEl.className = 'core';
            nextLevel();
        }

        function nextLevel() {
            playerCanClick = false;
            score++;
            scoreCountEl.innerText = score;
            sequence.push(Math.floor(Math.random() * 4));
            playerStep = 0;
            
            coreEl.className = 'core playing';
            coreEl.innerText = 'TX'; // Transmitting
            
            let i = 0;
            const interval = setInterval(() => {
                if (i >= sequence.length) {
                    clearInterval(interval);
                    coreEl.className = 'core listening';
                    coreEl.innerText = 'RX'; // Receiving
                    playerCanClick = true;
                    return;
                }
                flashPad(sequence[i]);
                i++;
            }, 600); // Speed could increase as level increases
        }

        function flashPad(id) {
            const pad = document.querySelector(`.pulse-pad[data-id="${id}"]`);
            if (!pad) return;
            pad.classList.add('active');
            playSound('pad', id);
            setTimeout(() => {
                pad.classList.remove('active');
            }, 300);
        }

        function handlePadClick(e) {
            if (!playerCanClick) return;
            const id = parseInt(e.target.dataset.id);
            
            flashPad(id);
            
            if (id === sequence[playerStep]) {
                playerStep++;
                if (playerStep === sequence.length) {
                    if (window.GlobalScore) window.GlobalScore.add(10);
                    playerCanClick = false;
                    setTimeout(nextLevel, 1000);
                }
            } else {
                gameOver();
            }
        }

        function gameOver() {
            playerCanClick = false;
            isPlaying = false;
            coreEl.className = 'core error';
            coreEl.innerText = 'ERR';
            playSound('error');
            
            if (score > best) {
                best = score;
                localStorage.setItem('memoryPulseBest', best);
                bestCountEl.innerText = best;
            }
            
            setTimeout(() => {
                winStatsTextEl.innerText = `SEQUENCE FAILED AT LEVEL ${score}`;
                winOverlayEl.classList.add('show');
            }, 1000);
        }

        pads.forEach(pad => pad.addEventListener('mousedown', handlePadClick));
        pads.forEach(pad => pad.addEventListener('touchstart', e => {
            e.preventDefault(); // prevent double firing with mousedown
            handlePadClick(e);
        }, {passive: false}));

        btnNew.addEventListener('click', initGame);
        btnWinRestart.addEventListener('click', initGame);

    </script>
</body>

</html>
